name: Deploy ProfilesSystem

on:
  push:
    branches:
      - main

concurrency:
  group: profiles-system-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar
        run: ./mvnw -B clean package -DskipTests

      - name: Upload jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: target/ProfilesSystem-*.jar
          target: /opt/profiles-system/
          strip_components: 1
          overwrite: true

      - name: Restart service and health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cp /opt/profiles-system/ProfilesSystem-*.jar /opt/profiles-system/app.jar
            systemctl restart profiles-system
            sleep 5
            systemctl is-active --quiet profiles-system
            curl --fail --silent http://127.0.0.1:8080/learnServer.html > /dev/null
