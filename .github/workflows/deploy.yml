name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 改动 1：换成官方 Action（只负责安装，不配凭证） ──
      - name: Setup Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: latest

      # ── 改动 2：官方 Action 不会自动配置，必须手动写 default profile ──
      - name: Configure Aliyun CLI
        run: |
          aliyun configure set \
            --profile default \
            --mode AK \
            --access-key-id "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            --access-key-secret "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" \
            --region "${{ secrets.ALIYUN_REGION }}"

      - name: Get runner public IP
        id: runner-ip
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          if [ -z "$IP" ]; then
            echo "::error::Failed to get runner public IP"
            exit 1
          fi
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $IP"

      - name: Authorize security group for this runner
        run: |
          aliyun ecs AuthorizeSecurityGroup \
            --version 2014-05-26 --force \
            --RegionId "${{ secrets.ALIYUN_REGION }}" \
            --SecurityGroupId "${{ secrets.ALIYUN_SECURITY_GROUP_ID }}" \
            --IpProtocol tcp \
            --PortRange 22/22 \
            --SourceCidrIp "${{ steps.runner-ip.outputs.ip }}/32" \
            --Priority 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            set -e
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-17.0.20.0.8-1.1.0.2.1.al8.x86_64
            export PATH=$JAVA_HOME/bin:$PATH
            cd /opt/profiles-system
            git pull origin main
            ./mvnw clean package -DskipTests
            systemctl restart profiles-system
            sleep 5
            systemctl is-active --quiet profiles-system

      # ── 改动 3：setup 失败时优雅跳过，不再报 command not found ──
      # ── 改动 4：SourceCidrIp 补 /32，与授权规则对齐，确保能撤销 ──
      - name: Revoke security group rule (always)
        if: always()
        run: |
          if ! command -v aliyun >/dev/null 2>&1; then
            echo "aliyun not installed (setup step failed), skip revoke"
            exit 0
          fi
          aliyun ecs RevokeSecurityGroup \
            --version 2014-05-26 --force \
            --RegionId "${{ secrets.ALIYUN_REGION }}" \
            --SecurityGroupId "${{ secrets.ALIYUN_SECURITY_GROUP_ID }}" \
            --IpProtocol tcp \
            --PortRange 22/22 \
            --SourceCidrIp "${{ steps.runner-ip.outputs.ip }}/32"