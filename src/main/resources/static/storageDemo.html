<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>存储云盘 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #f7f3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 5%, #ddd6fe 0, transparent 30%), radial-gradient(circle at 92% 88%, #bfdbfe 0, transparent 28%), linear-gradient(135deg, #f7f3ff, #eff6ff); }
      .page { width: min(1040px, calc(100% - 32px)); margin: auto; padding: 28px 0 42px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back { color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .hero { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
      .eyebrow { margin: 0 0 8px; color: #7e22ce; font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(30px, 5vw, 48px); letter-spacing: -.06em; }
      .hero p { margin: 10px 0 0; color: #64748b; font-size: 13px; }
      .level { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border: 1px solid #c084fc; border-radius: 999px; color: #7e22ce; background: linear-gradient(110deg, #faf5ff 0%, #e9d5ff 38%, #fff 50%, #e9d5ff 62%, #faf5ff 100%); background-size: 230% 100%; box-shadow: 0 0 0 1px #d8b4fe44, 0 5px 14px #a855f71c; animation: shimmer 3.2s ease-in-out infinite; font-size: 11px; font-weight: 800; }
      .level::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
      @keyframes shimmer { 0%,35% { background-position: 180% 0; } 70%,100% { background-position: -80% 0; } }
      .summary, .files { border: 1px solid #e9d5ff; border-radius: 22px; background: #ffffffdc; box-shadow: 0 18px 45px #6d28d916; }
      .summary { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1px; overflow: hidden; margin-bottom: 18px; background-color: #ede9fe; }
      .stat { padding: 22px; background: #ffffffd9; }
      .stat span { color: #64748b; font-size: 12px; }
      .stat strong { display: block; margin-top: 9px; color: #312e81; font-size: 24px; }
      .progress { height: 7px; margin-top: 13px; overflow: hidden; border-radius: 99px; background: #ede9fe; }
      .progress i { display: block; width: 18%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #6366f1, #a855f7); }
      .files { padding: 22px; }
      .files-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .files-head h2 { margin: 0; font-size: 18px; }
      .upload { padding: 10px 13px; border: 0; border-radius: 10px; color: #fff; background: #7e22ce; font: inherit; font-size: 12px; font-weight: 800; cursor: not-allowed; opacity: .7; }
      .file { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-top: 1px solid #f1edff; }
      .file-icon { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 10px; color: #6366f1; background: #eef2ff; }
      .file strong { display: block; font-size: 13px; }
      .file small { display: block; margin-top: 4px; color: #94a3b8; font-size: 11px; }
      .empty { margin-left: auto; color: #94a3b8; font-size: 12px; }
      .auth-pending .page { visibility: hidden; }
      @media (max-width: 700px) { .page { width: min(100% - 22px, 560px); padding-top: 18px; } .hero { align-items: flex-start; flex-direction: column; } .summary { grid-template-columns: 1fr; } .stat { padding: 18px; } }
      @media (prefers-reduced-motion: reduce) { .level { animation: none; } }
    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
  </style></head>
  <body class="auth-pending">
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · 内部服务</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="hero"><div><p class="eyebrow">Private cloud storage</p><h1>存储云盘</h1><p>你的学习资料，先在这里拥有一个整齐的位置。</p></div><span class="level">内部</span></section>
      <section class="summary"><div class="stat"><span>已使用空间</span><strong>1.8 GB</strong><div class="progress"><i></i></div></div><div class="stat"><span>可用空间</span><strong>8.2 GB</strong></div><div class="stat"><span>文件数量</span><strong>—</strong></div></section>
      <section class="files"><div class="files-head"><h2>最近文件</h2><button class="upload" type="button" disabled>＋ 上传文件（待接入）</button></div><div class="file"><span class="file-icon">◫</span><div><strong>样本项目</strong><small>项目文件夹 · 内部资源</small></div><span class="empty">接口接入后显示</span></div><div class="file"><span class="file-icon">▤</span><div><strong>我的学习资料</strong><small>资料文件夹 · 等待同步</small></div><span class="empty">接口接入后显示</span></div></section>
    </main>
    <script>
      fetch("/api/user/level", { credentials: "same-origin" }).then(async (response) => {
        if (response.status === 401) { location.replace("login.html?redirect=storageDemo.html"); return; }
        if (!response.ok) throw new Error("access denied");
        const result = await response.json();
        if (Number(result.code) !== 200 || Number(result.data) < 2) { location.replace("accessDenied.html?required=2"); return; }
        document.body.classList.remove("auth-pending");
      }).catch(() => location.replace("accessDenied.html?required=2"));
    </script>
  </body>
</html>
