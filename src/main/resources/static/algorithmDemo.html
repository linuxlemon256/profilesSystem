    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #f8fafc; }

      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 12% 8%, #dbeafe 0, transparent 30%), linear-gradient(135deg, #f8fafc, #f5f3ff); }
      .card { width: min(660px, 100%); padding: 50px clamp(28px, 7vw, 62px); border: 1px solid #dce5f5; border-radius: 26px; text-align: center; background: #ffffffdf; box-shadow: 0 22px 60px #30458e18; }

      .tag { display: inline-block; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 999px; color: #64748b; background: #fff; font-size: 11px; font-weight: 800; }
      h1 { margin: 18px 0 12px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -.05em; }
      p { margin: 0 auto; max-width: 470px; color: #64748b; line-height: 1.8; }
      .back { display: inline-block; margin-top: 26px; padding: 12px 16px; border-radius: 11px; color: #4338ca; background: #e0e7ff; font-size: 13px; font-weight: 800; text-decoration: none; }
    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
