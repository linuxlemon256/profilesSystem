<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM 学习助手 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      .auth-pending .page { visibility: hidden; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 0%, #c7d2fe 0, transparent 30%), radial-gradient(circle at 95% 90%, #a5f3fc 0, transparent 28%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); }
      .page { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 34px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .brand { display: flex; align-items: center; gap: 10px; color: #172554; font-size: 14px; font-weight: 800; }
      .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back { color: #4f46e5; font-size: 13px; font-weight: 700; text-decoration: none; }
      .back:hover { color: #0891b2; }
      .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; }
      .intro, .chat { border: 1px solid #dce5f5; border-radius: 24px; background: #ffffffd9; box-shadow: 0 20px 50px #30458e15; }
      .intro { padding: 25px; }
      .assistant-icon { display: grid; width: 54px; height: 54px; place-items: center; margin-bottom: 22px; border-radius: 17px; color: #fff; background: linear-gradient(135deg, #4f46e5, #0891b2); font-size: 25px; box-shadow: 0 12px 25px #4f46e532; }
      .eyebrow { margin: 0 0 8px; color: #4f46e5; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; color: #172554; font-size: 27px; letter-spacing: -.04em; }
      .intro p { color: #64748b; font-size: 13px; line-height: 1.75; }
      .status { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; padding: 8px 10px; border-radius: 10px; color: #64748b; background: #f1f5f9; font-size: 11px; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
      .chat { display: flex; height: min(650px, calc(100vh - 150px)); min-height: 520px; flex-direction: column; overflow: hidden; }
      .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #e8edf7; background: #ffffffa8; }
      .chat-head strong { font-size: 15px; }
      .chat-head span { color: #94a3b8; font-size: 11px; }
      .messages { flex: 1; min-height: 0; padding: 24px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #c7d2fe transparent; }
      .messages::-webkit-scrollbar { width: 7px; }
      .messages::-webkit-scrollbar-thumb { border-radius: 99px; background: #c7d2fe; }
      .message { display: flex; gap: 10px; max-width: 80%; margin-bottom: 18px; }
      .message.user { margin-left: auto; flex-direction: row-reverse; }
      .bubble-icon { display: grid; flex: none; width: 28px; height: 28px; place-items: center; border-radius: 9px; color: #fff; background: #6366f1; font-size: 12px; }
      .message.user .bubble-icon { background: #0f1735; }
      .bubble { padding: 12px 14px; border: 1px solid #e1e7f4; border-radius: 4px 15px 15px; color: #475569; background: #f8fafc; font-size: 13px; line-height: 1.75; }
      .message.user .bubble { border-color: #c7d2fe; border-radius: 15px 4px 15px 15px; color: #312e81; background: #eef2ff; }
      .composer { display: flex; gap: 10px; padding: 17px; border-top: 1px solid #e8edf7; background: #ffffffb8; }
      .composer input { min-width: 0; flex: 1; padding: 13px 14px; border: 1px solid #dce5f5; border-radius: 12px; outline: none; color: #172554; background: #fff; font: inherit; font-size: 13px; }
      .composer input:focus { border-color: #818cf8; box-shadow: 0 0 0 4px #818cf81c; }
      .composer button { padding: 0 18px; border: 0; border-radius: 12px; color: #fff; background: #4f46e5; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; }
      .composer button:hover { background: #4338ca; }
      @media (max-width: 700px) { .page { width: min(100% - 22px, 600px); padding-top: 18px; } .layout { grid-template-columns: 1fr; } .intro { padding: 20px; } .assistant-icon { display: inline-grid; margin: 0 12px 0 0; vertical-align: middle; } .intro h1 { display: inline; font-size: 23px; } .intro p { margin-bottom: 0; } .chat { height: 540px; min-height: 0; } .message { max-width: 92%; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · AI 学习空间</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="layout">
        <aside class="intro">
          <div class="assistant-icon">✦</div>
          <p class="eyebrow">Your study copilot</p>
          <h1>LLM 学习助手</h1>
          <p>遇到知识点、代码问题或学习路线疑惑，都可以先把问题放在这里。真正的 AI 接口正在路上，先让界面和你熟悉一下。</p>
          <div class="status">演示界面 · 接口待接入</div>
        </aside>
        <section class="chat" aria-label="AI 对话窗口">
          <div class="chat-head"><strong>和学习助手聊聊</strong><span>ProfilesSystem LLM</span></div>
          <div class="messages" id="messages">
            <div class="message"><div class="bubble-icon">✦</div><div class="bubble">你好！我是你的学习助手。后端接口接入后，我就可以帮你拆解知识点、分析代码和规划学习路线啦。</div></div>
            <div class="message user"><div class="bubble-icon">我</div><div class="bubble">那现在可以先做什么？</div></div>
            <div class="message"><div class="bubble-icon">✦</div><div class="bubble">可以先在下方输入一个问题，体验一下对话布局。现在我会先把你的问题记在这里，等真正的 AI 服务上线再认真回答～</div></div>
          </div>
          <form class="composer" id="composer"><input id="prompt" type="text" placeholder="输入你想问的问题…" autocomplete="off" /><button type="submit">发送</button></form>
        </section>
      </section>
    </main>
    <script>
      document.body.classList.add("auth-pending");
      const redirectAfterLogin = encodeURIComponent("LLMindex.html");

      async function ensureLogin() {
        try {
          const response = await fetch("/api/user/level", { credentials: "same-origin" });
          if (response.status === 401) throw new Error("not authenticated");
          if (response.status === 403) {
            window.location.replace("accessDenied.html?required=1");
            return;
          }
          if (!response.ok) throw new Error("not authenticated");
          const result = await response.json();
          if (Number(result.code) !== 200) throw new Error("not authenticated");
          if (Number(result.data) < 1) {
            window.location.replace("accessDenied.html?required=1");
            return;
          }
          document.body.classList.remove("auth-pending");
        } catch (error) {
          window.location.replace("login.html?redirect=" + redirectAfterLogin);
        }
      }

      const composer = document.getElementById("composer");
      const prompt = document.getElementById("prompt");
      const messages = document.getElementById("messages");
      composer.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        const userMessage = document.createElement("div");
        userMessage.className = "message user";
        userMessage.innerHTML = `<div class="bubble-icon">我</div><div class="bubble"></div>`;
        userMessage.querySelector(".bubble").textContent = text;
        messages.appendChild(userMessage);
        prompt.value = "";
        const placeholder = document.createElement("div");
        placeholder.className = "message";
        placeholder.innerHTML = '<div class="bubble-icon">✦</div><div class="bubble">收到啦！AI 接口接入后，我会在这里回答你。</div>';
        messages.appendChild(placeholder);
        messages.scrollTop = messages.scrollHeight;
      });
      ensureLogin();
    </script>
  </body>
</html>
