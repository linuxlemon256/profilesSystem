<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习组 · ProfilesSystem</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3ff,#f8fafc 58%,#f1edff)}.page{width:min(1040px,calc(100% - 32px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#9ca9ff,#62e4d5);color:#111a3b}.top a{color:#4f46e5;text-decoration:none;font-size:13px;font-weight:700}.hero{padding:58px 0 28px}.eyebrow{margin:0 0 10px;color:#4f46e5;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,6vw,56px);letter-spacing:-.06em}.hero p{color:#64748b;line-height:1.8}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:18px 0}.toolbar h2{margin:0;font-size:20px}.button,.group a{display:inline-flex;align-items:center;justify-content:center;padding:11px 15px;border:0;border-radius:11px;background:#4f46e5;color:#fff;text-decoration:none;font-size:13px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.group{padding:21px;border:1px solid #dce5f5;border-radius:19px;background:#ffffffd9;box-shadow:0 12px 32px #30458e12;transition:.25s}.group:hover{transform:translateY(-5px);border-color:#a5b4fc;box-shadow:0 20px 42px #30458e22}.group h3{margin:16px 0 8px;font-size:18px}.group p{min-height:50px;margin:0;color:#64748b;font-size:13px;line-height:1.7}.meta{margin:15px 0;color:#818cad;font-size:12px}.group a{background:#eef2ff;color:#4338ca}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#0f173588;backdrop-filter:blur(8px)}.modal[hidden]{display:none}.dialog{width:min(470px,100%);padding:27px;border-radius:21px;background:#fff;box-shadow:0 24px 70px #17255444}.dialog h2{margin:0}.field{margin-top:15px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.field input,.field textarea{width:100%;padding:12px;border:1px solid #dbe3f2;border-radius:10px;font:inherit}.field textarea{min-height:100px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.cancel{border:1px solid #dbe3f2;background:#fff;color:#475569}.empty,.error{grid-column:1/-1;padding:32px;text-align:center;color:#64748b}.error{color:#b91c1c}@media(max-width:700px){.grid{grid-template-columns:1fr}.page{width:min(100% - 22px,560px)}.toolbar{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><a href="learnIndex.html">返回学习空间</a></header><section class="hero"><p class="eyebrow">Study groups</p><h1>一起学习，慢慢变强。</h1><p>创建一个小组，围绕专业、算法或项目持续交流。这里是学习组功能的第一版，后续可以继续接入公告、任务和进度协作。</p></section><div class="toolbar"><h2>学习组</h2><button class="button" id="newGroup">创建学习组</button></div><section class="grid" id="groups"><div class="empty">正在加载学习组…</div></section></main><div class="modal" id="modal" hidden><form class="dialog" id="form"><h2>创建学习组</h2><div class="field"><label for="name">学习组名称</label><input id="name" maxlength="80" required placeholder="例如：Java 基础共学组"></div><div class="field"><label for="description">简介</label><textarea id="description" maxlength="255" placeholder="这个学习组准备一起做什么？"></textarea></div><div class="dialog-actions"><button type="button" class="button cancel" id="cancel">取消</button><button class="button" type="submit">创建</button></div></form></div><script>
const root=document.getElementById('groups'),modal=document.getElementById('modal'),form=document.getElementById('form'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt){const r=await fetch(url,opt),j=await r.json();if(j.code===401){location.href='login.html?redirect=groups.html';throw Error('请先登录')}if(j.code!==200)throw Error(j.message||'请求失败');return j.data}async function load(){try{const data=await api('/api/groups');root.innerHTML=(data||[]).map(g=>`<article class="group"><h3>${esc(g.name)}</h3><p>${esc(g.description||'还没有写简介')}</p><div class="meta">创建者：${esc(g.ownerUsername)} · ${g.memberCount||0} 位成员</div><a href="#" data-join="${g.id}">加入学习组 →</a></article>`).join('')||'<div class="empty">还没有学习组，创建第一个吧。</div>'}catch(e){root.innerHTML=`<div class="error">${esc(e.message)}</div>`}}root.addEventListener('click',async e=>{const a=e.target.closest('[data-join]');if(!a)return;e.preventDefault();try{await api('/api/groups/'+a.dataset.join+'/join',{method:'POST'});a.textContent='已加入';a.style.pointerEvents='none';await load()}catch(err){alert(err.message)}});document.getElementById('newGroup').onclick=()=>modal.hidden=false;document.getElementById('cancel').onclick=()=>modal.hidden=true;modal.onclick=e=>{if(e.target===modal)modal.hidden=true};form.onsubmit=async e=>{e.preventDefault();try{await api('/api/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,description:document.getElementById('description').value})});modal.hidden=true;form.reset();load()}catch(err){alert(err.message)}};load();
</script></body></html>
