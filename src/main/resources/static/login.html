<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · ProfilesSystem</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #eef2ff;
        background: #090d1d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
                radial-gradient(circle at 15% 15%, #3947a8 0, transparent 32%),
                radial-gradient(circle at 90% 85%, #0e7490 0, transparent 30%),
                #090d1d;
      }
      .orb {
        position: fixed;
        width: 360px;
        height: 360px;
        border: 1px solid #ffffff18;
        border-radius: 50%;
        filter: blur(0.2px);
        right: -100px;
        top: -130px;
      }
      .orb:after {
        content: "";
        display: block;
        width: 160px;
        height: 160px;
        border: 1px solid #ffffff14;
        border-radius: 50%;
        margin: 100px;
      }
      .shell {
        width: min(940px, 92vw);
        min-height: 570px;
        display: grid;
        grid-template-columns: 1fr 1.05fr;
        overflow: hidden;
        border: 1px solid #ffffff1c;
        border-radius: 28px;
        background: #ffffff0b;
        box-shadow: 0 28px 90px #0008;
        backdrop-filter: blur(22px);
      }
      .aside {
        padding: 58px 48px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: linear-gradient(145deg, #ffffff16, #ffffff03);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        color: #111a3b;
        font-weight: 900;
      }
      .aside h1 {
        margin: 0;
        font-size: clamp(32px, 4vw, 48px);
        line-height: 1.12;
        letter-spacing: -0.04em;
      }
      .aside p {
        max-width: 300px;
        color: #b8c1e0;
        line-height: 1.8;
      }
      .quote {
        font-size: 13px;
        color: #8792ba;
      }
      .card {
        padding: 58px 10%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #090d1db8;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #7eebdc;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .card h2 {
        margin: 0 0 10px;
        font-size: 32px;
      }
      .sub {
        margin: 0 0 34px;
        color: #9da7c8;
      }
      .login-methods { display: flex; gap: 7px; margin: 0 0 18px; padding: 4px; border-radius: 11px; background: #ffffff0b; }
      .method-tab { flex: 1; padding: 9px 6px; border: 0; border-radius: 8px; color: #9da7c8; background: transparent; font: inherit; font-size: 12px; cursor: pointer; }
      .method-tab.active { color: #111a3b; background: linear-gradient(100deg, #9ca9ff, #62e4d5); font-weight: 800; }
      .field {
        margin: 17px 0;
      }
      .field label {
        display: block;
        margin-bottom: 9px;
        color: #cbd3ef;
        font-size: 13px;
      }
      .field input {
        width: 100%;
        padding: 15px 16px;
        border: 1px solid #ffffff20;
        border-radius: 12px;
        outline: none;
        background: #ffffff0b;
        color: #fff;
        font-size: 15px;
        transition: 0.2s;
      }
      .field input:focus {
        border-color: #7eebdc;
        box-shadow: 0 0 0 4px #7eebdc18;
      }
      .action {
        width: 100%;
        margin-top: 10px;
        padding: 15px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(100deg, #9ca9ff, #62e4d5);
        color: #111a3b;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
      }
      .action:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 25px #62e4d544;
      }
      .error {
        display: none;
        margin: 10px 0 0;
        color: #ff9db0;
        font-size: 13px;
        line-height: 1.6;
      }
      .error.show {
        display: block;
      }
      .links {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        font-size: 13px;
      }
      .links a {
        color: #b8c1e0;
        text-decoration: none;
      }
      .links a:hover {
        color: #7eebdc;
      }
      .hint {
        margin-top: 22px;
        color: #7782a7;
        font-size: 12px;
      }
      @media (max-width: 700px) {
        body {
          overflow: auto;
          padding: 20px;
        }
        .shell {
          grid-template-columns: 1fr;
          min-height: auto;
        }
        .aside {
          padding: 34px 28px;
          gap: 30px;
        }
        .aside h1 {
          font-size: 34px;
        }
        .card {
          padding: 36px 28px 42px;
        }
      }

    </style>
  </head>
  <body>
    <div class="orb"></div>
    <main class="shell">
      <section class="aside">
        <div class="brand">
          <span class="mark">P</span><span>ProfilesSystem</span>
        </div>
        <div>
          <h1>欢迎回来，<br />继续你的探索。</h1>
          <p>
            登录后即可访问云端存储与大模型教学手册，让每一次学习都被妥善保存。
          </p>
        </div>
        <div class="quote">Private workspace · Secure by design</div>
      </section>
      <section class="card">
        <p class="eyebrow">Member access</p>
        <h2>登录账户</h2>
        <p class="sub">输入你的账户信息以继续</p>
        <div class="login-methods" role="tablist" aria-label="登录方式">
          <button class="method-tab active" type="button" data-mode="invite">邀请码</button>
          <button class="method-tab" type="button" data-mode="account">账户密码</button>
          <button class="method-tab" type="button" data-mode="email">邮箱密码</button>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="theProfiles">账户</label
            ><input
              id="theProfiles"
              name="name"
              type="text"
              placeholder="请输入账户名称"
              autocomplete="username"
              autofocus
              required
            />
          </div>
          <div class="field" id="emailField" hidden>
            <label for="theEmail">邮箱</label><input id="theEmail" name="email" type="email" placeholder="请输入注册邮箱" autocomplete="email" />
          </div>
          <div class="field">
            <label for="theInviteCode">邀请码</label
            ><input
              id="theInviteCode"
              name="code"
              type="text"
              placeholder="请输入邀请码"
              autocomplete="one-time-code"
              autocapitalize="characters"
              spellcheck="false"
              required
            />
          </div>
          <div class="field" id="passwordField" hidden>
            <label for="thePassword">密码</label><input id="thePassword" name="password" type="password" placeholder="请输入登录密码" autocomplete="current-password" />
          </div>
          <div class="error" id="loginError" role="status" aria-live="polite"></div>
          <button class="action" id="submitLogin" type="submit">登录</button>
        </form>
        <div class="links">
          <a href="register.html">没有账户？去申请</a
          ><a href="recovery.html">找回登录信息</a
          ><a href="managerLogin.html">管理员登录</a
          ><a href="learnServer.html">返回首页</a>
        </div>
        <div class="hint">访问受限资源前，请确认你已获得有效授权。</div>
      </section>
    </main>
    <script>
      const loginForm = document.getElementById("loginForm");
      const errorBox = document.getElementById("loginError");
      const button = document.getElementById("submitLogin");
      const requestedRedirect = new URLSearchParams(window.location.search).get("redirect");
      const tabs = document.querySelectorAll(".method-tab");
      const emailField = document.getElementById("emailField");
      const passwordField = document.getElementById("passwordField");
      const accountField = document.getElementById("theProfiles").closest(".field");
      const codeField = document.getElementById("theInviteCode").closest(".field");
      let mode = "invite";

      function setMode(nextMode) {
        mode = nextMode;
        tabs.forEach((tab) => tab.classList.toggle("active", tab.dataset.mode === mode));
        accountField.hidden = mode === "email";
        emailField.hidden = mode !== "email";
        codeField.hidden = mode !== "invite";
        passwordField.hidden = mode === "invite";
        document.getElementById("theProfiles").required = mode !== "email";
        document.getElementById("theEmail").required = mode === "email";
        document.getElementById("theInviteCode").required = mode === "invite";
        document.getElementById("thePassword").required = mode !== "invite";
      }
      tabs.forEach((tab) => tab.addEventListener("click", () => setMode(tab.dataset.mode)));

      function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add("show");
      }

      function clearError() {
        errorBox.textContent = "";
        errorBox.classList.remove("show");
      }

      async function login() {
        const username = document.getElementById("theProfiles").value.trim();
        const code = document.getElementById("theInviteCode").value.trim();
        const email = document.getElementById("theEmail").value.trim();
        const password = document.getElementById("thePassword").value;

        clearError();

        if (mode === "invite" && (!username || !code)) {
          showError("请填写账户和邀请码");
          return;
        }
        if (mode === "account" && (!username || !password)) {
          showError("请填写账户和密码");
          return;
        }
        if (mode === "email" && (!email || !password)) {
          showError("请填写邮箱和密码");
          return;
        }

        button.disabled = true;
        try {
          const endpoint = mode === "invite" ? "/api/user/login" : `/api/user/login/${mode}`;
          const body = mode === "invite" ? { username, code } : mode === "account" ? { username, password } : { email, password };
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify(body),
          });

          let result = null;
          try {
            result = await response.json();
          } catch (error) {
            // 后端异常时可能返回非 JSON 内容，统一按失败处理
          }
          if (!result) {
            showError("服务暂不可用，请稍后重试");
            return;
          }

          const success = Number(result.code) === 200;
          if (success) {
            const name = result.data || username;
            const destination = ["LLMindex.html", "projectDemo.html", "storageDemo.html"].includes(requestedRedirect)
              ? requestedRedirect
              : "learnIndex.html?name=" + encodeURIComponent(name);
            window.location.replace(destination);
          } else {
            showError(result.message || "登录失败，请稍后重试");
          }
        } catch (error) {
          console.error("Error:", error);
          showError("网络异常，请稍后重试");
        } finally {
          button.disabled = false;
        }
      }

      loginForm.addEventListener("submit", (event) => {
        event.preventDefault();
        login();
      });

    </script>
  </body>
</html>
