<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · ProfilesSystem</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="orb"></div>
    <main class="shell">
      <section class="aside">
        <div class="brand">
          <span class="mark">P</span><span>ProfilesSystem</span>
        </div>
        <div>
          <h1>欢迎回来，<br />继续你的探索。</h1>
          <p>
            登录后即可访问云端存储与大模型教学手册，让每一次学习都被妥善保存。
          </p>
        </div>
        <div class="quote">Private workspace · Secure by design</div>
      </section>
      <section class="card">
        <p class="eyebrow">Member access</p>
        <h2>登录账户</h2>
        <p class="sub">输入你的账户信息以继续</p>
        <form
          onsubmit="
            login();
            return false;
          "
        >
          <div class="field">
            <label for="theProfiles">账户</label
            ><input
              id="theProfiles"
              name="name"
              type="text"
              placeholder="请输入账户名称"
              autocomplete="username"
              required
            />
          </div>
          <div class="field">
            <label for="theInviteCode">邀请码</label
            ><input
              id="theInviteCode"
              name="code"
              type="text"
              placeholder="请输入邀请码"
              autocomplete="one-time-code"
              autocapitalize="characters"
              spellcheck="false"
              required
            />
          </div>
          <div class="error" id="loginError"></div>
          <button class="action" id="submitLogin" type="submit">登录</button>
        </form>
        <div class="links">
          <a href="register.html">没有账户？去申请</a
          ><a href="managerLogin.html">管理员登录</a
          ><a href="learnServer.html">返回首页</a>
        </div>
        <div class="hint">访问受限资源前，请确认你已获得有效授权。</div>
      </section>
    </main>
    <script src="login.js" defer></script>
  </body>
</html>
