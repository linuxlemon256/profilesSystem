<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资源跳转 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 10%, #c7d2fe 0, transparent 32%), radial-gradient(circle at 90% 90%, #a5f3fc 0, transparent 28%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); }
      .resource-shell { width: min(680px, 100%); }
      .brand-line { display: flex; align-items: center; gap: 10px; margin: 0 0 14px 8px; color: #64748b; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
      .mark, .resource-icon { display: grid; place-items: center; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .mark { width: 30px; height: 30px; border-radius: 10px; font-weight: 900; }
      .resource-card { position: relative; overflow: hidden; padding: clamp(32px, 7vw, 58px); text-align: center; background: #ffffffdc; border: 1px solid #dce5f5; border-radius: 28px; box-shadow: 0 24px 65px #30458e18; }
      .resource-card::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, #4f46e5, #06b6d4); }
      .resource-icon { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 20px; font-size: 30px; box-shadow: 0 10px 24px #4f46e528; }
      .eyebrow { margin: 0 0 12px; color: #4f46e5; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      .resource-card h1 { margin: 0; font-size: clamp(28px, 6vw, 46px); letter-spacing: -.05em; }
      .description { max-width: 470px; margin: 18px auto 0; color: #64748b; line-height: 1.8; }
      .destination { min-height: 52px; margin: 26px auto 0; padding: 10px; }
      .destination a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 19px; border-radius: 11px; color: #fff; background: #4f46e5; text-decoration: none; font-size: 13px; font-weight: 800; box-shadow: 0 10px 20px #4f46e52e; transition: transform .2s, background .2s; }
      .destination a:hover { transform: translateY(-2px); background: #4338ca; }
      .destination .error { color: #b91c1c; font-size: 13px; }
      .back { display: inline-block; margin-top: 16px; padding: 11px 15px; border-radius: 10px; color: #4338ca; background: #e0e7ff; text-decoration: none; font-size: 13px; font-weight: 700; }
      .back:hover { background: #c7d2fe; }
      .note { margin: 24px 0 0; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="resource-shell">
      <div class="brand-line"><span class="mark">P</span><span>ProfilesSystem · 内部资源</span></div>
      <section class="resource-card">
        <div class="resource-icon">↗</div>
        <p class="eyebrow">Link resource</p>
        <h1 id="resourceTitle">资源跳转</h1>
        <p class="description">资源链接已经准备好，点击下方按钮即可在新标签页中打开。请确认你正在使用可信的网络环境。</p>
        <div class="destination" id="resourceLink" aria-live="polite">正在准备资源链接…</div>
        <a class="back" href="learnIndex.html">← 返回资源选择页</a>
        <p class="note" id="resourceNote">ProfilesSystem · 学习资源</p>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const resourceLink = document.getElementById("resourceLink");
      const resourceTitle = document.getElementById("resourceTitle");
      const resourceNote = document.getElementById("resourceNote");
      const target = params.get("url") || "";

      if (params.get("title")) resourceTitle.textContent = params.get("title");
      if (params.get("note")) resourceNote.textContent = params.get("note");

      function showError(message) {
        resourceLink.innerHTML = `<span class="error">${message}</span>`;
      }

      if (!target) {
        showError("资源链接暂未配置");
      } else {
        try {
          const url = new URL(target);
          if (!/^https?:$/.test(url.protocol)) throw new Error("unsupported protocol");
          const link = document.createElement("a");
          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "打开资源 ↗";
          resourceLink.replaceChildren(link);
        } catch {
          showError("资源链接格式不正确，请返回资源选择页重试");
        }
      }
    </script>
  </body>
</html>
