<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>自动化专业 · ProfilesSystem</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #172554;
        background: #eef3ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff);
      }
      .top {
        height: 72px;
        background: #0f1735;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 6vw, 88px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        color: #111a3b;
      }
      .top a {
        color: #cbd5f5;
        text-decoration: none;
        font-size: 13px;
      }
      .top a:hover {
        color: #7eebdc;
      }
      .wrap {
        max-width: 1100px;
        margin: auto;
        padding: 56px clamp(20px, 6vw, 88px) 70px;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #4f46e5;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .hero {
        padding: 32px;
        border-radius: 22px;
        background: #0f1735;
        color: #fff;
        box-shadow: 0 16px 35px #18265b24;
      }
      .hero h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 52px);
        letter-spacing: -0.05em;
      }
      .hero p {
        max-width: 700px;
        margin: 15px 0 0;
        color: #cbd5f5;
        line-height: 1.8;
      }
      .meta {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .meta span {
        padding: 7px 11px;
        border: 1px solid #ffffff24;
        border-radius: 99px;
        color: #dbeafe;
        font-size: 12px;
      }
      .section {
        margin-top: 30px;
      }
      .section h2 {
        margin: 0 0 15px;
        font-size: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .card {
        padding: 22px;
        background: #ffffffdc;
        border: 1px solid #dce5f5;
        border-radius: 17px;
        box-shadow: 0 10px 25px #30458e10;
      }
      .card b {
        display: block;
        color: #4f46e5;
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .card h3 {
        margin: 10px 0 8px;
        font-size: 18px;
      }
      .card p {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 1.7;
      }
      .back {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 16px;
        border-radius: 10px;
        background: #e0e7ff;
        color: #4338ca;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wrap {
          padding-top: 32px;
        }
      }

    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
  </style></head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark">P</span><span>ProfilesSystem</span>
      </div>
<a href="learnIndex.html">返回专业选择</a>
    </header>
    <main class="wrap">
      <section class="hero">
        <p class="eyebrow">Major · Automation</p>
        <h1>自动化专业</h1>
        <p>
          从控制原理、传感器与工业网络出发，逐步掌握自动化系统设计、调试与智能控制。
        </p>
        <div class="meta">
          <span>控制原理</span><span>传感器技术</span><span>工业网络</span>
        </div>
      </section>
      <section class="section">
        <h2>学习模块</h2>
        <div class="grid">
          <article class="card">
            <b>01 · 控制</b>
            <h3>自动控制原理</h3>
            <p>
              理解系统建模、反馈控制、稳定性分析与控制器设计，打好自动化理论基础。
            </p>
          </article>
          <article class="card">
            <b>02 · 感知</b>
            <h3>传感器与嵌入式</h3>
            <p>
              学习传感器选型、信号采集、单片机和嵌入式系统，完成设备感知与执行。
            </p>
          </article>
          <article class="card">
            <b>03 · 系统</b>
            <h3>工业网络与智能控制</h3>
            <p>
              掌握 PLC、工业通信、机器人和智能控制技术，构建可落地的自动化系统。
            </p>
          </article>
        </div>
      </section>
<a class="back" href="learnIndex.html">← 返回专业选择</a>
    </main>
  </body>
</html>
