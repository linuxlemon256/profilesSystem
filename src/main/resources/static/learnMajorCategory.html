<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>专业类别 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 8%, #c7d2fe 0, transparent 30%), radial-gradient(circle at 94% 90%, #a5f3fc 0, transparent 27%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); }
      .page { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back { color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .hero { padding: 70px 0 48px; }
      .eyebrow { margin: 0 0 10px; color: #4f46e5; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.06em; }
      .hero p { max-width: 620px; margin: 18px 0 0; color: #64748b; line-height: 1.8; }
      .section-title { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
      .section-title h2 { margin: 0; font-size: 21px; }
      .section-title span { color: #64748b; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
      .route { position: relative; min-height: 250px; padding: 26px; border: 1px solid #dce5f5; border-radius: 21px; background: #ffffffd9; box-shadow: 0 14px 38px #30458e14; transition: .2s; }
      .route { cursor: pointer; }
      .route:hover { transform: translateY(-4px); border-color: #a5b4fc; box-shadow: 0 20px 46px #30458e20; }
      .route.card-enter { animation: cardIn .45s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: var(--card-delay, 0ms); }
      @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .route.selected { border-color: #6366f1; box-shadow: 0 0 0 4px #6366f11f, 0 22px 48px #30458e24; }
      .route-icon { display: grid; width: 47px; height: 47px; place-items: center; border-radius: 14px; color: #4338ca; background: #e0e7ff; font-size: 22px; }
      .route h3 { margin: 22px 0 9px; font-size: 21px; }
      .route p { margin: 0; color: #64748b; line-height: 1.75; font-size: 14px; }
      .route a { display: inline-block; margin-top: 23px; color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .route a:hover { color: #0891b2; }
      .tag { position: absolute; top: 20px; right: 20px; padding: 5px 9px; border: 1px solid #93c5fd; border-radius: 999px; color: #2563eb; background: #eff6ff; font-size: 11px; font-weight: 800; }
      .tag.demo { border-color: #cbd5e1; color: #64748b; background: #fff; }
      .mode-switch { display: inline-flex; gap: 6px; margin: 0 0 22px; padding: 5px; border: 1px solid #dbe4ff; border-radius: 15px; background: #eef2ff; box-shadow: inset 0 1px 2px #312e8110; }
      .mode-button { min-width: 116px; min-height: 42px; padding: 0 16px; border: 0; border-radius: 11px; color: #64748b; background: transparent; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; transition: color .2s, background .2s, box-shadow .2s, transform .2s; }
      .mode-button:hover { color: #4338ca; background: #ffffffa3; }
      .mode-button.is-active { color: #fff; background: linear-gradient(135deg, #4f46e5, #7c3aed); box-shadow: 0 8px 19px #4f46e536; }
      .mode-button:focus-visible { outline: 3px solid #818cf866; outline-offset: 2px; }
      .foot { margin-top: 40px; color: #94a3b8; font-size: 12px; }
      @media (max-width: 680px) { .page { width: min(100% - 22px, 560px); padding-top: 18px; } .hero { padding: 56px 0 40px; } .grid { grid-template-columns: 1fr; } .section-title { align-items: flex-start; flex-direction: column; } .mode-switch { display: grid; width: 100%; grid-template-columns: 1fr 1fr; } .mode-button { min-width: 0; } }
    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
  </style>    <style id="category-match">
      .route.wide { grid-column: 1 / -1; }
      .major-meta { margin-top: 7px; color: #6366f1; font-size: 11px; font-weight: 800; }
      .source { margin-top: 28px; color: #94a3b8; font-size: 11px; line-height: 1.7; }
      .source a { color: #64748b; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand"><span class="mark">P</span><span id="brandName">ProfilesSystem · 专业类别</span></div>
        <a class="back" href="moreMajors.html">← 返回更多专业</a>
      </header>
      <section class="hero">
        <p class="eyebrow" id="fieldName">Major category</p>
        <h1 id="categoryName">专业类别</h1>
        <p id="categorySummary"></p>
      </section>
      <section>
        <div class="section-title"><h2>学习导向</h2><span id="sectionHint">先确定方向，再沿着适合自己的节奏前进</span></div>
        <div class="mode-switch" id="contentModeSwitch" role="tablist" aria-label="学习导向">
          <button class="mode-button is-active" type="button" role="tab" data-value="route" aria-selected="true">路线方向</button>
          <button class="mode-button" type="button" role="tab" data-value="major" aria-selected="false">具体专业</button>
        </div>
        <input type="hidden" id="contentMode" value="route" />
        <div class="grid" id="cardGrid"></div>
      </section>
      <p class="source">专业名称依据教育部《普通高等学校本科专业目录（2026年）》整理；“特设”和“国控”标记沿用目录代码。<a href="https://www.moe.gov.cn/srcsite/A08/moe_1034/s3882/202604/W020260427440749576927.pdf" target="_blank" rel="noopener noreferrer">查看官方目录</a></p>
      <p class="foot" id="footText">ProfilesSystem · 专业学习空间</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const categorySlug = /^[a-z0-9-]+$/.test(params.get("category") || "") ? params.get("category") : "computer";
      const contentMode = document.getElementById("contentMode");
      const cardGrid = document.getElementById("cardGrid");
      const sectionHint = document.getElementById("sectionHint");
      const contentModeSwitch = document.getElementById("contentModeSwitch");
      const modeButtons = Array.from(contentModeSwitch.querySelectorAll(".mode-button"));
      let pageData = null;

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;").replaceAll("'", "&#39;");
      }

      function safeTarget(value, fallback) {
        if (!value) return fallback;
        if (/^[a-zA-Z0-9_-]+\.html(?:\?[^\s]*)?$/.test(value)) return value;
        if (/^https:\/\//i.test(value)) return value;
        return fallback;
      }

      function typeLabel(type) {
        if (type === "SPECIAL_CONTROLLED") return "特设 · 国控";
        if (type === "CONTROLLED") return "国控";
        if (type === "SPECIAL") return "特设";
        return "基本";
      }

      function cardsFor(mode) {
        if (!pageData) return [];
        if (mode === "route") {
          return (pageData.routes || []).map(function (route) {
            const fallback = "routeDemo.html?title=" + encodeURIComponent(route.title || "学习路线") +
              "&return=" + encodeURIComponent("learnMajorCategory.html?category=" + categorySlug);
            return {
              icon: route.icon || "⌘",
              title: route.title,
              description: route.description,
              href: safeTarget(route.targetUrl, fallback),
              action: "进入学习路线"
            };
          });
        }
        return (pageData.majors || []).map(function (major) {
          return {
            icon: "◇",
            title: major.name,
            description: major.code + " · " + typeLabel(major.programType) + " · " + pageData.category.name + "本科专业",
            href: "majorDemo.html?title=" + encodeURIComponent(major.name) +
              "&return=" + encodeURIComponent("learnMajorCategory.html?category=" + categorySlug),
            action: "查看专业导向"
          };
        });
      }

      function renderCards() {
        const mode = contentMode.value;
        const cards = cardsFor(mode);
        sectionHint.textContent = mode === "route"
          ? "共 " + cards.length + " 条学习路线"
          : "共 " + cards.length + " 个具体专业";
        if (!cards.length) {
          cardGrid.innerHTML = '<article class="route wide"><div class="route-icon">…</div><h3>内容正在整理</h3><p>这个类别暂时没有已发布的' +
            (mode === "route" ? "学习路线" : "具体专业") + '。</p></article>';
          return;
        }
        cardGrid.innerHTML = cards.map(function (item) {
          return '<article class="route"><span class="tag">公开</span><div class="route-icon">' +
            escapeHtml(item.icon) + '</div><h3>' + escapeHtml(item.title) + '</h3><p>' +
            escapeHtml(item.description) + '</p><a href="' + escapeHtml(item.href) + '">' +
            escapeHtml(item.action) + ' →</a></article>';
        }).join("");
        cardGrid.querySelectorAll(".route").forEach(function (card, index) {
          card.style.setProperty("--card-delay", Math.min(index * 45, 360) + "ms");
          card.classList.add("card-enter");
        });
      }

      function chooseMode(button) {
        modeButtons.forEach(function (item) {
          const active = item === button;
          item.classList.toggle("is-active", active);
          item.setAttribute("aria-selected", String(active));
          item.tabIndex = active ? 0 : -1;
        });
        contentMode.value = button.dataset.value;
        renderCards();
      }

      async function loadCategory() {
        cardGrid.innerHTML = '<article class="route wide"><div class="route-icon">…</div><h3>正在加载</h3><p>正在从学习目录中读取专业与路线。</p></article>';
        try {
          const response = await fetch("/api/learning/categories/" + encodeURIComponent(categorySlug));
          const result = await response.json();
          if (!response.ok || result.code !== 200 || !result.data) throw new Error(result.message || "专业类别加载失败");
          pageData = result.data;
          const category = pageData.category;
          document.getElementById("brandName").textContent = "ProfilesSystem · " + category.name + "专业";
          document.getElementById("categoryName").textContent = category.name;
          document.getElementById("fieldName").textContent = category.fieldName;
          document.getElementById("categorySummary").textContent = category.summary;
          document.getElementById("footText").textContent = "ProfilesSystem · " + category.name + "专业学习空间";
          document.title = category.name + "专业 · ProfilesSystem";
          renderCards();
        } catch (error) {
          document.getElementById("categoryName").textContent = "专业内容加载失败";
          document.getElementById("categorySummary").textContent = error.message || "请稍后重试";
          cardGrid.innerHTML = '<article class="route wide"><div class="route-icon">!</div><h3>暂时无法读取目录</h3><p>' +
            escapeHtml(error.message || "请检查网络或数据库配置") + '</p></article>';
        }
      }

      modeButtons.forEach(function (button, index) {
        button.tabIndex = index === 0 ? 0 : -1;
        button.addEventListener("click", function () { chooseMode(button); });
        button.addEventListener("keydown", function (event) {
          if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
          event.preventDefault();
          const step = event.key === "ArrowRight" ? 1 : -1;
          const next = modeButtons[(index + step + modeButtons.length) % modeButtons.length];
          chooseMode(next);
          next.focus();
        });
      });
      cardGrid.addEventListener("click", function (event) {
        if (event.target.closest("a")) return;
        const link = event.target.closest(".route")?.querySelector("a[href]");
        if (link) link.click();
      });
      loadCategory();
    </script>
  </body>
</html>
