        sectionHint.textContent = mode === "route" ? "选择一条路线开始学习" : "共 " + category.majors.length + " 个具体专业";
        cardGrid.innerHTML = getCards(mode).map(function (item) {
          return '<article class="route' + (item.wide ? ' wide' : '') + '"><span class="tag">公开</span><div class="route-icon">' + item.icon + '</div><h3>' + item.title + '</h3><p>' + item.description + '</p><a href="' + item.href + '">' + item.action + ' →</a></article>';
        }).join("");
        cardGrid.querySelectorAll(".route").forEach(function (card, index) {
          card.style.setProperty("--card-delay", Math.min(index * 45, 360) + "ms");
          card.classList.add("card-enter");
        });
      }

      function closeModeMenu() {
        contentModeBox.classList.remove("is-open");
        modeTrigger.setAttribute("aria-expanded", "false");
      }

      function chooseMode(option) {
        modeOptions.forEach(function (item) { item.setAttribute("aria-selected", String(item === option)); });
        contentMode.value = option.dataset.value;
        modeValue.textContent = option.textContent.trim();
        closeModeMenu();
        renderCards();
      }

      document.getElementById("brandName").textContent = "ProfilesSystem · " + category.name + "专业";
      document.getElementById("categoryName").textContent = category.name;
      document.getElementById("fieldName").textContent = category.field;
      document.getElementById("categorySummary").textContent = category.summary;
      document.getElementById("footText").textContent = "ProfilesSystem · " + category.name + "专业学习空间";
      document.title = category.name + "专业 · ProfilesSystem";

      modeTrigger.addEventListener("click", function () {
        const opening = !contentModeBox.classList.contains("is-open");
        contentModeBox.classList.toggle("is-open", opening);
        modeTrigger.setAttribute("aria-expanded", String(opening));
        if (opening) modeOptions.find(function (item) { return item.getAttribute("aria-selected") === "true"; })?.focus();
      });
      modeOptions.forEach(function (option) {
        option.addEventListener("click", function () { chooseMode(option); });
        option.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") chooseMode(option);
          if (event.key === "Escape") { closeModeMenu(); modeTrigger.focus(); }
        });
      });
      document.addEventListener("click", function (event) { if (!contentModeBox.contains(event.target)) closeModeMenu(); });
      cardGrid.addEventListener("click", function (event) {
        if (event.target.closest("a")) return;
        const link = event.target.closest(".route")?.querySelector("a[href]");
        if (link) link.click();
      });
      renderCards();
    </script>
  </body>
</html>
