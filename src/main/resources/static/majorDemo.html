<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>专业页面施工中 · ProfilesSystem</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #172554;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff);
      }
      .box {
        width: min(620px, 100%);
        padding: 48px 38px;
        text-align: center;
        background: #ffffffdc;
        border: 1px solid #dce5f5;
        border-radius: 26px;
        box-shadow: 0 20px 55px #30458e18;
      }
      .mark {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        border-radius: 18px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        font-size: 28px;
        color: #111a3b;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: #4f46e5;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .box h1 {
        margin: 0;
        color: #172554;
        font-size: clamp(30px, 6vw, 48px);
        letter-spacing: -0.05em;
      }
      .box p {
        margin: 18px auto 0;
        max-width: 430px;
        color: #64748b;
        line-height: 1.9;
      }
      .loading {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin: 26px 0;
      }
      .loading i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4f46e5;
        animation: bounce 1s infinite ease-in-out;
      }
      .loading i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .loading i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0.65);
          opacity: 0.45;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .back {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 17px;
        border-radius: 11px;
        background: #e0e7ff;
        color: #4338ca;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      .back:hover {
        background: #c7d2fe;
      }
      .note {
        margin-top: 22px !important;
        color: #94a3b8 !important;
        font-size: 12px;
      }

    </style>
  </head>
  <body>
    <main class="box">
      <div class="mark">✦</div>
      <p class="eyebrow">Under construction</p>
      <h1>哎呀，这里还在搭积木！</h1>
      <p>
        什么？你还是点啦！<br>
        这个专业还在仔细选择<br>
        课程页面还在认真设计<br>
        你不要着急！<br>
        等我们把知识点、案例和小彩蛋装好，再邀请你来参观。
      </p>
      <div class="loading" aria-label="页面设计中"><i></i><i></i><i></i></div>
        <a class="back" href="learnIndex.html">← 先回专业选择页</a>
      <p class="note">别着急，好内容值得多打磨一会儿。</p>
    </main>
  </body>
</html>
