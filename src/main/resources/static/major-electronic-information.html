const STORAGE_KEY='eie-study-center-progress-v1';let done=new Set();try{done=new Set(JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'))}catch{}
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([...done]))}catch{showToast('浏览器未允许本地存储，进度无法保存')}}
function countTier(t){return courses.filter(c=>t==='all'||c.tier===t).reduce((n,c)=>n+c.topics.length,0)}
function setupNav(){const nav=document.getElementById('tierNav');nav.innerHTML=['all','S','A','B','C'].map(t=>`<button data-tier="${t}" class="${selectedTier===t?'active':''}"><span>${tierNames[t]}</span><span class="badge">${countTier(t)}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedTier=b.dataset.tier;setupNav();render()});const tn=document.getElementById('trackNav');tn.innerHTML=trackNames.map(t=>`<button data-track="${t}" class="${selectedTrack===t?'active':''}"><span>${t}</span></button>`).join('');tn.querySelectorAll('button').forEach(b=>b.onclick=()=>{selectedTrack=b.dataset.track;setupNav();render()})}
function filteredCourses(){const q=query.trim().toLowerCase();let list=courses.map(c=>({...c,visibleTopics:c.topics.filter(t=>{const matchText=!q||(c.name+' '+c.id+' '+t.id+' '+t.text).toLowerCase().includes(q);const matchStatus=status==='all'||(status==='done'?done.has(t.id):!done.has(t.id));return matchText&&matchStatus})})).filter(c=>(selectedTier==='all'||c.tier===selectedTier)&&(selectedTrack==='全部方向'||tracksFor(c).includes(selectedTrack))&&c.visibleTopics.length>0);if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));else if(sort==='progress')list.sort((a,b)=>progressOf(b)-progressOf(a));else list.sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id));return list}
function progressOf(c){return c.topics.length?c.topics.filter(t=>done.has(t.id)).length/c.topics.length:0}
function render(){const list=filteredCourses();const grid=document.getElementById('courseGrid');const expanded=new Set([...grid.querySelectorAll('details[open]')].map(card=>card.dataset.courseId));document.getElementById('crumbTier').textContent=selectedTrack==='全部方向'?tierNames[selectedTier]:selectedTrack;document.getElementById('resultCount').textContent=`显示 ${list.length} 个课程模块 · ${list.reduce((n,c)=>n+c.visibleTopics.length,0)} 个知识点`;
if(!list.length){grid.innerHTML='<div class="empty">没有找到匹配内容。试试其他关键词或清除筛选条件。</div>';return}
grid.innerHTML=list.map(c=>{const complete=c.topics.filter(t=>done.has(t.id)).length,pct=Math.round(progressOf(c)*100),open=query.length>0||expanded.has(c.id);return `<details data-course-id="${c.id}" class="course" ${open?'open':''}><summary><div class="course-head"><span class="tier-tag tier-${c.tier}">${c.tier} 级</span><div class="course-title"><strong>${esc(c.name)}</strong><small>${c.id} · ${complete}/${c.topics.length} 个知识点已掌握</small></div><span class="score">${esc(c.scoreLabel)} 分</span><span class="chevron">⌄</span></div><div class="mini-track"><div class="mini-fill" style="width:${pct}%"></div></div><div class="course-meta"><span>${tierDescriptions[c.tier]}</span><span>${pct}%</span></div></summary><div class="topics">${c.visibleTopics.map(t=>`<label class="topic ${done.has(t.id)?'done':''}"><input type="checkbox" data-id="${t.id}" ${done.has(t.id)?'checked':''}><span><b class="topic-code">${t.id}</b>${esc(t.text)}</span></label>`).join('')}</div></details>`}).join('');grid.querySelectorAll('input[type=checkbox]').forEach(ch=>ch.addEventListener('change',()=>{if(ch.checked)done.add(ch.dataset.id);else done.delete(ch.dataset.id);save();updateStats();const card=ch.closest('details');const course=courses.find(c=>c.id===card.dataset.courseId);const count=course.topics.filter(t=>done.has(t.id)).length;const pct=Math.round(count/course.topics.length*100);ch.closest('.topic').classList.toggle('done',ch.checked);card.querySelector('.course-title small').textContent=`${course.id} · ${count}/${course.topics.length} 个知识点已掌握`;card.querySelector('.mini-fill').style.width=pct+'%';card.querySelector('.course-meta span:last-child').textContent=pct+'%';if(status!=='all'||sort==='progress')render()}));updateStats()}
function updateStats(){const total=courses.reduce((n,c)=>n+c.topics.length,0),n=[...done].filter(id=>courses.some(c=>c.topics.some(t=>t.id===id))).length,pct=total?Math.round(n*100/total):0;document.getElementById('totalTopics').textContent=total;document.getElementById('doneTopics').textContent=n;document.getElementById('totalCourses').textContent=courses.length;document.getElementById('progressPct').textContent=pct;document.getElementById('heroProgress').style.width=pct+'%'}
let toastTimer;function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200)}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});document.getElementById('statusFilter').addEventListener('change',e=>{status=e.target.value;render()});document.getElementById('sortSelect').addEventListener('change',e=>{sort=e.target.value;render()});
document.getElementById('resetBtn').onclick=()=>{if(confirm('确定清除本浏览器保存的全部学习进度？')){done.clear();save();setupNav();render();showToast('学习进度已重置')}};

setupNav();render();
</script>
</body>
</html>
