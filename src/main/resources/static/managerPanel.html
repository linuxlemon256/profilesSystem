<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>管理面板 · ProfilesSystem</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #172554;
        background: #eef3ff;
        --primary: #4f46e5;
        --ink: #172554;
        --muted: #64748b;
        --line: #dce5f5;
        --card: #fff;
        --green: #059669;
        --red: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff);
        min-height: 100vh;
      }
      .topbar {
        height: 72px;
        background: #0f1735;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 5vw, 64px);
        box-shadow: 0 8px 24px #18265b25;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        color: #111a3b;
      }
      .admin {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #cbd5f5;
        font-size: 13px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ffffff1c;
        color: #fff;
        font-weight: 700;
      }
      .layout {
        max-width: 1320px;
        margin: auto;
        padding: 34px clamp(20px, 5vw, 64px) 60px;
      }
      .heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .heading h1 {
        margin: 0;
        color: var(--ink);
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      .heading p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .refresh {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 10px 15px;
        border-radius: 10px;
        cursor: pointer;
      }
      .refresh:hover {
        border-color: #a5b4fc;
        color: var(--primary);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 19px;
        background: #ffffffc9;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 25px #30458e0b;
      }
      .stat span {
        color: var(--muted);
        font-size: 13px;
      }
      .stat b {
        display: block;
        margin-top: 8px;
        font-size: 27px;
        color: var(--ink);
      }
      .stat em {
        font-style: normal;
        font-size: 12px;
        color: var(--green);
      }
      .panel {
        background: #ffffffdb;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 12px 35px #30458e12;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 11px;
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
      }
      .toolbar input,
      .toolbar select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      .toolbar input {
        width: 260px;
      }
      .toolbar input:focus,
      .toolbar select:focus {
        border-color: #818cf8;
      }
      .toolbar .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
      }
      th,
      td {
        text-align: left;
        padding: 16px 20px;
        border-bottom: 1px solid #e8edf7;
        font-size: 13px;
      }
      th {
        background: #f8faff;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      td {
        color: #334155;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-dot {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #e0e7ff;
        color: #4338ca;
        font-weight: 800;
      }
      .user strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
      }
      .user small {
        color: var(--muted);
      }
      .reason {
        max-width: 270px;
        line-height: 1.55;
      }
      .badge {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
      }
      .pending {
        background: #fff7ed;
        color: #c2410c;
      }
      .approved {
        background: #ecfdf5;
        color: #047857;
      }
      .rejected {
        background: #fef2f2;
        color: #b91c1c;
      }
      .actions {
        display: flex;
        gap: 7px;
      }
      .actions button {
        border: 0;
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .approve {
        background: #d1fae5;
        color: #047857;
      }
      .reject {
        background: #fee2e2;
        color: #b91c1c;
      }
      .view {
        background: #e0e7ff;
        color: #4338ca;
      }
      .empty {
        text-align: center;
        padding: 48px;
        color: var(--muted);
        display: none;
      }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 13px 17px;
        border-radius: 11px;
        background: #0f1735;
        color: #fff;
        box-shadow: 0 12px 30px #0003;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.25s;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 800px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .toolbar input {
          width: 100%;
        }
        .toolbar .count {
          margin-left: 0;
        }
      }
      @media (max-width: 480px) {
        .stats {
          gap: 9px;
        }
        .stat {
          padding: 14px;
        }
        .stat b {
          font-size: 22px;
        }
        .layout {
          padding-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">P</span><span>ProfilesSystem · 管理面板</span>
      </div>
      <div class="admin"><span>管理员</span><span class="avatar">A</span></div>
    </header>
    <main class="layout">
      <section class="heading">
        <div>
          <p class="eyebrow">Administrator workspace</p>
          <h1>账户申请审批</h1>
          <p>审核成员申请、管理账户状态与系统访问权限。</p>
        </div>
        <button class="refresh" id="refresh">↻ 刷新列表</button>
      </section>
      <section class="stats">
        <div class="stat">
          <span>待处理申请</span><b id="pendingCount">3</b><em>需要及时审核</em>
        </div>
        <div class="stat"><span>今日新增</span><b>8</b><em>较昨日 +2</em></div>
        <div class="stat">
          <span>已通过</span><b id="approvedCount">24</b><em>持续增长中</em>
        </div>
        <div class="stat">
          <span>已拒绝</span><b id="rejectedCount">5</b><em>本月累计</em>
        </div>
      </section>
      <section class="panel">
        <div class="toolbar">
          <input
            id="search"
            type="search"
            placeholder="搜索账户名称或联系方式"
          /><select id="status">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option></select
          ><span class="count" id="resultCount"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>申请账户</th>
                <th>申请原因</th>
                <th>联系方式</th>
                <th>提交时间</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty">没有找到符合条件的申请</div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      const applications = [
        {
          id: 1,
          name: "skywalker",
          reason: "希望学习大模型应用开发与 RAG 实践。",
          contact: "skywalker@example.com",
          time: "今天 09:42",
          status: "pending",
        },
        {
          id: 2,
          name: "chen-data",
          reason: "参与课程项目，需要访问教学手册。",
          contact: "QQ 2846****",
          time: "今天 08:17",
          status: "pending",
        },
        {
          id: 3,
          name: "mori",
          reason: "申请云端资料存储空间。",
          contact: "未填写",
          time: "昨天 16:30",
          status: "pending",
        },
        {
          id: 4,
          name: "nova-lab",
          reason: "团队内部学习使用。",
          contact: "nova@example.com",
          time: "10月26日",
          status: "approved",
        },
        {
          id: 5,
          name: "bytecat",
          reason: "跟进 Agent 开发路线。",
          contact: "GitHub / bytecat",
          time: "10月25日",
          status: "rejected",
        },
      ];
      const labels = {
        pending: "待审核",
        approved: "已通过",
        rejected: "已拒绝",
      };
      const rows = document.getElementById("rows");
      function render() {
        const q = document.getElementById("search").value.trim().toLowerCase(),
          f = document.getElementById("status").value;
        const list = applications.filter(
          (x) =>
            (f === "all" || x.status === f) &&
            (!q ||
              [x.name, x.contact, x.reason]
                .join(" ")
                .toLowerCase()
                .includes(q)),
        );
        rows.innerHTML = list
          .map(
            (x) =>
              `<tr><td><div class="user"><span class="user-dot">${x.name[0].toUpperCase()}</span><div><strong>${x.name}</strong><small>#APP-${String(x.id).padStart(4, "0")}</small></div></div></td><td><div class="reason">${x.reason}</div></td><td>${x.contact}</td><td>${x.time}</td><td><span class="badge ${x.status}">${labels[x.status]}</span></td><td><div class="actions">${x.status === "pending" ? `<button class="approve" onclick="setStatus(${x.id},'approved')">通过</button><button class="reject" onclick="setStatus(${x.id},'rejected')">拒绝</button>` : ""}<button class="view" onclick="showToast('详情接口可在此接入')">查看</button></div></td></tr>`,
          )
          .join("");
        document.getElementById("empty").style.display = list.length
          ? "none"
          : "block";
        document.getElementById("resultCount").textContent =
          `显示 ${list.length} 条申请`;
        document.getElementById("pendingCount").textContent =
          applications.filter((x) => x.status === "pending").length;
        document.getElementById("approvedCount").textContent =
          24 + applications.filter((x) => x.status === "approved").length - 1;
        document.getElementById("rejectedCount").textContent =
          5 + applications.filter((x) => x.status === "rejected").length - 1;
      }
      function setStatus(id, status) {
        const x = applications.find((x) => x.id === id);
        if (x) {
          x.status = status;
          render();
          showToast(status === "approved" ? "申请已通过" : "申请已拒绝");
        }
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }
      document.getElementById("search").addEventListener("input", render);
      document.getElementById("status").addEventListener("change", render);
      document.getElementById("refresh").addEventListener("click", () => {
        render();
        showToast("列表已刷新");
      });
      render();
    </script>
  </body>
</html>
