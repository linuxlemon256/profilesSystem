<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>管理面板 · ProfilesSystem</title>
    <link rel="stylesheet" href="managerPanel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">P</span><span>ProfilesSystem · 管理面板</span>
      </div>
      <div class="admin">
        <span>管理员</span><span class="avatar">A</span>
        <button class="logout" id="logout">退出</button>
      </div>
    </header>
    <main class="layout">
      <section class="heading">
        <div>
          <p class="eyebrow">Administrator workspace</p>
          <h1>账户申请审批</h1>
          <p>审核成员申请、管理账户状态与系统访问权限。</p>
        </div>
        <button class="refresh" id="refresh">↻ 刷新列表</button>
      </section>
      <section class="stats">
        <div class="stat">
          <span>待处理申请</span><b id="pendingCount">0</b><em>需要及时审核</em>
        </div>
        <div class="stat">
          <span>账户总数</span><b id="totalCount">0</b
          ><em>待审 + 已通过 + 已拒绝</em>
        </div>
        <div class="stat">
          <span>已通过</span><b id="approvedCount">0</b><em>持续增长中</em>
        </div>
        <div class="stat">
          <span>已拒绝</span><b id="rejectedCount">0</b><em>累计</em>
        </div>
      </section>
      <section class="panel">
        <div class="toolbar">
          <input
            id="search"
            type="search"
            placeholder="搜索账户名称或联系方式"
          /><select id="status">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option></select
          ><span class="count" id="resultCount"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>申请账户</th>
                <th>申请原因</th>
                <th>联系方式</th>
                <th>提交时间</th>
                <th>状态</th>
                <th>邀请码</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty">没有找到符合条件的申请</div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script src="managerPanel.js" defer></script>
  </body>
</html>
