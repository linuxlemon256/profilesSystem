<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>管理面板 · ProfilesSystem</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #172554;
        background: #eef3ff;
        --primary: #4f46e5;
        --ink: #172554;
        --muted: #64748b;
        --line: #dce5f5;
        --card: #fff;
        --green: #059669;
        --red: #dc2626;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff);
        min-height: 100vh;
      }
      .topbar {
        height: 72px;
        background: #0f1735;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 5vw, 64px);
        box-shadow: 0 8px 24px #18265b25;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
        letter-spacing: 0.03em;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        color: #111a3b;
      }
      .admin {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #cbd5f5;
        font-size: 13px;
      }
      .logout {
        border: 1px solid #ffffff33;
        background: transparent;
        color: #cbd5f5;
        padding: 7px 12px;
        border-radius: 9px;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
      }
      .logout:hover {
        background: #ffffff1a;
        color: #fff;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #ffffff1c;
        color: #fff;
        font-weight: 700;
      }
      .layout {
        max-width: 1320px;
        margin: auto;
        padding: 34px clamp(20px, 5vw, 64px) 60px;
      }
      .heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .heading h1 {
        margin: 0;
        color: var(--ink);
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      .heading p {
        margin: 8px 0 0;
        color: var(--muted);
      }
      .refresh {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 10px 15px;
        border-radius: 10px;
        cursor: pointer;
      }
      .refresh:hover {
        border-color: #a5b4fc;
        color: var(--primary);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 24px;
      }
      .stat {
        padding: 19px;
        background: #ffffffc9;
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 8px 25px #30458e0b;
      }
      .stat span {
        color: var(--muted);
        font-size: 13px;
      }
      .stat b {
        display: block;
        margin-top: 8px;
        font-size: 27px;
        color: var(--ink);
      }
      .stat em {
        font-style: normal;
        font-size: 12px;
        color: var(--green);
      }
      .panel {
        background: #ffffffdb;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 12px 35px #30458e12;
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 11px;
        padding: 17px 20px;
        border-bottom: 1px solid var(--line);
      }
      .toolbar input,
      .toolbar select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        outline: none;
      }
      .toolbar input {
        width: 260px;
      }
      .toolbar input:focus,
      .toolbar select:focus {
        border-color: #818cf8;
      }
      .toolbar .count {
        margin-left: auto;
        color: var(--muted);
        font-size: 13px;
      }
      .table-wrap {
        overflow: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 850px;
      }
      th,
      td {
        text-align: left;
        padding: 16px 20px;
        border-bottom: 1px solid #e8edf7;
        font-size: 13px;
      }
      th {
        background: #f8faff;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      td {
        color: #334155;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-dot {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: #e0e7ff;
        color: #4338ca;
        font-weight: 800;
      }
      .user strong {
        display: block;
        color: var(--ink);
        font-size: 14px;
      }
      .user small {
        color: var(--muted);
      }
      .reason {
        max-width: 270px;
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .reason.expanded {
        -webkit-line-clamp: unset;
        overflow: visible;
      }
      .badge {
        display: inline-flex;
        padding: 5px 9px;
        border-radius: 99px;
        font-size: 12px;
        font-weight: 700;
      }
      .pending {
        background: #fff7ed;
        color: #c2410c;
      }
      .approved {
        background: #ecfdf5;
        color: #047857;
      }
      .rejected {
        background: #fef2f2;
        color: #b91c1c;
      }
      .invite-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.06em;
        color: var(--muted);
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 7px;
      }
      .actions button {
        border: 0;
        border-radius: 8px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .approve {
        background: #d1fae5;
        color: #047857;
      }
      .reject {
        background: #fee2e2;
        color: #b91c1c;
      }
      .view {
        background: #e0e7ff;
        color: #4338ca;
      }
      .empty {
        text-align: center;
        padding: 48px;
        color: var(--muted);
        display: none;
      }
      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 13px 17px;
        border-radius: 11px;
        background: #0f1735;
        color: #fff;
        box-shadow: 0 12px 30px #0003;
        opacity: 0;
        transform: translateY(10px);
        transition: 0.25s;
      }
      .toast.show {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 800px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .toolbar input {
          width: 100%;
        }
        .toolbar .count {
          margin-left: 0;
        }
      }
      @media (max-width: 480px) {
        .stats {
          gap: 9px;
        }
        .stat {
          padding: 14px;
        }
        .stat b {
          font-size: 22px;
        }
        .layout {
          padding-top: 24px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">P</span><span>ProfilesSystem · 管理面板</span>
      </div>
      <div class="admin">
        <span>管理员</span><span class="avatar">A</span>
        <button class="logout" id="logout">退出</button>
      </div>
    </header>
    <main class="layout">
      <section class="heading">
        <div>
          <p class="eyebrow">Administrator workspace</p>
          <h1>账户申请审批</h1>
          <p>审核成员申请、管理账户状态与系统访问权限。</p>
        </div>
        <button class="refresh" id="refresh">↻ 刷新列表</button>
      </section>
      <section class="stats">
        <div class="stat">
          <span>待处理申请</span><b id="pendingCount">0</b><em>需要及时审核</em>
        </div>
        <div class="stat"><span>账户总数</span><b id="totalCount">0</b><em>待审 + 已通过 + 已拒绝</em></div>
        <div class="stat">
          <span>已通过</span><b id="approvedCount">0</b><em>持续增长中</em>
        </div>
        <div class="stat">
          <span>已拒绝</span><b id="rejectedCount">0</b><em>累计</em>
        </div>
      </section>
      <section class="panel">
        <div class="toolbar">
          <input
            id="search"
            type="search"
            placeholder="搜索账户名称或联系方式"
          /><select id="status">
            <option value="all">全部状态</option>
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option></select
          ><span class="count" id="resultCount"></span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>申请账户</th>
                <th>申请原因</th>
                <th>联系方式</th>
                <th>提交时间</th>
                <th>状态</th>
                <th>邀请码</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <div class="empty" id="empty">没有找到符合条件的申请</div>
        </div>
      </section>
    </main>
    <div class="toast" id="toast"></div>
    <script>
      const labels = {
        pending: "待审核",
        approved: "已通过",
        rejected: "已拒绝",
      };

      let applications = [];

      const rows = document.getElementById("rows");

      // 后端统一返回 Result：code 为 200 时取 data，否则抛出 message
      async function request(url, options) {
        const response = await fetch(url, options);
        const result = await response.json();
        if (result.code === 401) {
          location.href = "/managerLogin.html";
          throw new Error("请先登录");
        }
        if (result.code !== 200) {
          throw new Error(result.message || "请求失败");
        }
        return result.data;
      }

      function formatTime(value) {
        if (!value) return "—";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "—";
        const pad = (n) => String(n).padStart(2, "0");
        const hhmm = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        const now = new Date();
        const yesterday = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() - 1,
        );
        if (date.toDateString() === now.toDateString()) return `今天 ${hhmm}`;
        if (date.toDateString() === yesterday.toDateString())
          return `昨天 ${hhmm}`;
        return `${pad(date.getMonth() + 1)}月${pad(date.getDate())}日`;
      }

      function toApplication(user, status) {
        return {
          name: user.username,
          reason: user.reason || "未填写",
          contact: user.email || "未填写",
          time: formatTime(user.createdAt),
          code: user.code || "",
          status: status,
        };
      }

      async function loadApplications() {
        try {
          const [pending, approved, rejected] = await Promise.all([
            request("/api/user/get/uncommit"),
            request("/api/user/get/commit"),
            request("/api/user/get/rejected"),
          ]);
          applications = [
            ...(pending || []).map((u) => toApplication(u, "pending")),
            ...(approved || []).map((u) => toApplication(u, "approved")),
            ...(rejected || []).map((u) => toApplication(u, "rejected")),
          ];
          render();
          return true;
        } catch (error) {
          console.error(error);
          showToast("加载失败：" + error.message);
          return false;
        }
      }

      // 用户名、邮箱、原因都来自注册表单，渲染前必须转义，避免 XSS
      function escapeHtml(value) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        };
        return String(value ?? "").replace(/[&<>"']/g, (c) => map[c]);
      }

      function render() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const f = document.getElementById("status").value;
        const list = applications.filter(
          (x) =>
            (f === "all" || x.status === f) &&
            (!q ||
              [x.name, x.contact, x.reason, x.code]
                .join(" ")
                .toLowerCase()
                .includes(q)),
        );

        rows.innerHTML = list
          .map((x) => {
            const initial = escapeHtml(
              (x.name || "").slice(0, 1).toUpperCase(),
            );
            const name = escapeHtml(x.name);
            const actions =
              x.status === "pending"
                ? `<button class="approve" data-action="approve" data-name="${name}">通过</button><button class="reject" data-action="reject" data-name="${name}">拒绝</button>`
                : "";
            return `<tr><td><div class="user"><span class="user-dot">${initial}</span><div><strong>${name}</strong></div></div></td><td><div class="reason" title="${escapeHtml(
              x.reason,
            )}">${escapeHtml(x.reason)}</div></td><td>${escapeHtml(x.contact)}</td><td>${escapeHtml(
              x.time,
            )}</td><td><span class="badge ${x.status}">${
              labels[x.status]
            }</span></td><td class="invite-code">${
              x.status === "approved" ? escapeHtml(x.code || "—") : "—"
            }</td><td><div class="actions">${actions}<button class="view" data-action="view" data-name="${name}">查看</button></div></td></tr>`;
          })
          .join("");

        document.getElementById("empty").style.display = list.length
          ? "none"
          : "block";
        document.getElementById("resultCount").textContent =
          `显示 ${list.length} 条申请`;

        const countBy = (status) =>
          applications.filter((x) => x.status === status).length;
        document.getElementById("pendingCount").textContent = countBy("pending");
        document.getElementById("approvedCount").textContent =
          countBy("approved");
        document.getElementById("rejectedCount").textContent =
          countBy("rejected");
        document.getElementById("totalCount").textContent = applications.length;
      }

      async function setStatus(name, status) {
        const url =
          status === "approved"
            ? `/api/user/approve/${encodeURIComponent(name)}`
            : `/api/user/reject/${encodeURIComponent(name)}`;
        try {
          const code = await request(url, { method: "POST" });
          if (status === "approved") {
            showToast(code ? `申请已通过，邀请码：${code}` : "申请已通过");
          } else {
            showToast("申请已拒绝");
          }
          await loadApplications();
        } catch (error) {
          console.error(error);
          showToast("操作失败：" + error.message);
        }
      }

      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      // 事件委托绑定按钮，避免把用户名拼进 onclick
      rows.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-action]");
        if (!button) {
          // 点击申请原因可在「3 行省略」和「展开全文」之间切换
          const reason = event.target.closest(".reason");
          if (reason) reason.classList.toggle("expanded");
          return;
        }
        const name = button.dataset.name;
        const action = button.dataset.action;
        if (action === "view") {
          const item = applications.find((x) => x.name === name);
          showToast(item ? `${item.name} · ${item.contact}` : "未找到该申请");
          return;
        }
        setStatus(name, action === "approve" ? "approved" : "rejected");
      });

      document.getElementById("search").addEventListener("input", render);
      document.getElementById("status").addEventListener("change", render);
      document.getElementById("logout").addEventListener("click", async () => {
        try {
          await fetch("/api/manager/logout", { method: "POST" });
        } catch (error) {
          console.error(error);
        }
        location.href = "/managerLogin.html";
      });

      document.getElementById("refresh").addEventListener("click", async () => {
        if (await loadApplications()) {
          showToast("列表已刷新");
        }
      });

      loadApplications();
    </script>
  </body>
</html>
