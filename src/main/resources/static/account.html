<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>我的账户 · ProfilesSystem</title>

    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #172554;
        background: #eef3ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff);
      }
      .top {
        height: 72px;
        background: #0f1735;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(20px, 6vw, 88px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        background: linear-gradient(135deg, #9ca9ff, #62e4d5);
        color: #111a3b;
      }
      .top a {
        color: #cbd5f5;
        text-decoration: none;
        font-size: 13px;
      }
      .top a:hover {
        color: #7eebdc;
      }
      .wrap {
        max-width: 980px;
        margin: auto;
        padding: 58px 24px;
      }
      .hero {
        padding: 32px;
        background: #0f1735;
        color: #fff;
        border-radius: 22px;
        box-shadow: 0 16px 35px #18265b26;
      }
      .eyebrow {
        margin: 0 0 10px;
        color: #7eebdc;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .hero h1 {
        margin: 0;
        font-size: 38px;
      }
      .hero p {
        margin: 12px 0 0;
        color: #cbd5f5;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-top: 20px;
      }
      .card {
        padding: 23px;
        background: #ffffffd9;
        border: 1px solid #dce5f5;
        border-radius: 17px;
        box-shadow: 0 10px 25px #30458e10;
      }
      .card span {
        color: #64748b;
        font-size: 13px;
      }
      .card strong {
        display: block;
        margin-top: 10px;
        color: #172554;
        font-size: 18px;
      }
      .level-badge {
        display: block !important;
        margin-top: 10px !important;
        padding: 0;
        border: 0;
        border-radius: 0;
        color: #6366f1 !important;
        background: transparent;
        font-size: 18px !important;
      }
      .level-badge.level-internal { color: #7e22ce !important; }
      .level-badge.level-public { color: #2563eb !important; }
      .account-detail {
        margin-top: 20px;
        padding: 23px;
        background: #ffffffd9;
        border: 1px solid #dce5f5;
        border-radius: 17px;
        box-shadow: 0 10px 25px #30458e10;
      }
      .account-detail p {
        display: flex;
        gap: 14px;
        margin: 0;
        color: #64748b;
        font-size: 13px;
        line-height: 1.9;
      }
      .account-detail p + p {
        margin-top: 8px;
      }
      .account-detail span {
        flex: 0 0 72px;
        color: #64748b;
      }
      .account-detail strong {
        color: #172554;
        font-size: 14px;
        font-weight: 700;
        word-break: break-word;
      }
      .actions {
        margin-top: 22px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
      }
      .primary {
        background: #4f46e5;
        color: #fff;
      }
      .secondary {
        background: #e0e7ff;
        color: #4338ca;
      }
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .hero h1 {
          font-size: 30px;
        }
      }
      @media (min-width: 681px) and (max-width: 900px) {
        .grid { grid-template-columns: repeat(2, 1fr); }
      }

    </style>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="mark">P</span><span>ProfilesSystem</span>
      </div>
      <a href="learnIndex.html">返回专业选择</a>
    </header>
    <main class="wrap">
      <section class="hero">
        <p class="eyebrow">Personal account</p>
        <h1 id="welcome">我的账户</h1>
        <p>查看账户信息、申请状态和学习空间入口。</p>
      </section>
      <section class="grid">
        <article class="card">
          <span>账户名称</span><strong id="accountName">未登录</strong>
        </article>
        <article class="card">
          <span>账户状态</span><strong id="accountStatus">读取中…</strong>
        </article>
        <article class="card">
          <span>联系方式</span><strong id="accountEmail">未填写</strong>
        </article>
        <article class="card">
          <span>用户等级</span><strong class="level-badge level-public" id="accountLevel">游客</strong>
        </article>
      </section>
      <section class="account-detail">
        <p><span>申请原因</span><strong id="accountReason">读取中…</strong></p>
        <p><span>加入时间</span><strong id="accountCreatedAt">读取中…</strong></p>
      </section>
      <div class="actions">
        <a class="btn primary" href="learnIndex.html">选择专业方向</a
        ><a class="btn secondary" href="index.html">访问个人主页</a
        ><a class="btn secondary" id="logoutLink" href="login.html">退出登录</a>
      </div>
    </main>
    <script>
      const logoutLink = document.getElementById("logoutLink");

      /** 审核状态文案。 */
      function statusText(isin) {
        if (isin === 1) return "已通过审核";
        if (isin === 2) return "审核未通过";
        return "审核中";
      }

      function setText(id, value) {
        document.getElementById(id).textContent = value;
      }

      function levelInfo(level) {
        const numericLevel = Number(level);
        if (numericLevel === 2) {
          return { label: "内部人员", className: "level-internal" };
        }
        if (numericLevel === 1) {
          return { label: "关联人员", className: "level-associated" };
        }
        return { label: "游客", className: "level-public" };
      }

      async function loadAccount() {
        try {
          const response = await fetch("/api/user/me");
          if (response.status === 401) {
            location.href = "login.html";
            return;
          }
          const result = await response.json();
          if (result.code === 401) {
            location.href = "login.html";
            return;
          }
          if (result.code !== 200 || !result.data) {
            throw new Error(result.message || "账户信息读取失败");
          }

          const user = result.data;
          setText("accountName", user.username || "未填写");
          setText("welcome", "你好，" + (user.username || "成员"));
          setText("accountStatus", statusText(user.isin));
          setText("accountEmail", user.email || "未填写");
          const level = levelInfo(user.level);
          const levelElement = document.getElementById("accountLevel");
          levelElement.textContent = level.label;
          levelElement.className = "level-badge " + level.className;
          setText("accountReason", user.reason || "未填写");
          setText(
                  "accountCreatedAt",
                  user.createdAt
                          ? new Date(user.createdAt).toLocaleDateString("zh-CN")
                          : "—"
          );
        } catch (error) {
          console.error(error);
          setText("accountStatus", "读取失败");
        }
      }

      async function logout() {
        logoutLink.setAttribute("aria-disabled", "true");
        try {
          await fetch("/api/user/logout", { method: "POST" });
        } catch (error) {
          console.error(error);
        }
        location.href = "login.html";
      }

      logoutLink.addEventListener("click", (event) => {
        event.preventDefault();
        logout();
      });

      loadAccount();

    </script>
  </body>
</html>
