<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>学习路线设计中 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 10% 10%, #ddd6fe 0, transparent 31%), radial-gradient(circle at 90% 88%, #bfdbfe 0, transparent 27%), linear-gradient(135deg, #f5f3ff, #f8fafc 58%, #eff6ff); }
      .box { width: min(660px, 100%); padding: clamp(34px, 7vw, 54px); border: 1px solid #ddd6fe; border-radius: 28px; text-align: center; background: #ffffffdf; box-shadow: 0 22px 60px #6d28d91a; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
      .mark { display: grid; width: 62px; height: 62px; place-items: center; margin: 0 auto 20px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, #7c3aed, #4f46e5); font-size: 27px; }
      .kind { display: inline-flex; padding: 6px 10px; border: 1px solid #c4b5fd; border-radius: 999px; color: #6d28d9; background: #f5f3ff; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
      h1 { margin: 18px 0 12px; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.05em; }
      .subject { color: #7c3aed; }
      p { max-width: 470px; margin: 0 auto; color: #64748b; line-height: 1.85; }
      .steps { display: flex; justify-content: center; gap: 7px; margin: 26px 0 20px; }
      .steps i { width: 8px; height: 8px; border-radius: 50%; background: #8b5cf6; animation: pulse 1.1s infinite ease-in-out; }
      .steps i:nth-child(2) { animation-delay: .15s; } .steps i:nth-child(3) { animation-delay: .3s; }
      .back { display: inline-flex; padding: 12px 17px; border-radius: 11px; color: #6d28d9; background: #ede9fe; font-size: 13px; font-weight: 800; text-decoration: none; transition: .2s; }
      .back:hover { transform: translateY(-2px); background: #ddd6fe; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 0%,80%,100% { opacity: .35; transform: scale(.65); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .box, .steps i { animation: none; } }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="mark">∑</div><span class="kind">路线通用页</span>
      <h1><span class="subject" id="subject">这条路线</span><br />正在铺设路标</h1>
      <p>阶段目标、知识顺序和实践任务正在梳理。路线正式开放后，你会看到从起点到能力出口的完整指引。</p>
      <div class="steps" aria-label="学习路线设计中"><i></i><i></i><i></i></div>
      <a class="back" id="backLink" href="learnIndex.html">← 返回学习导向</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const title = (params.get("title") || "这条路线").slice(0, 60);
      const returnPage = params.get("return") || "learnIndex.html";
      document.getElementById("subject").textContent = title;
      document.title = title + " · 学习路线设计中";
      if (/^[a-zA-Z0-9_-]+\.html$/.test(returnPage)) document.getElementById("backLink").href = returnPage;
    </script>
  </body>
</html>
