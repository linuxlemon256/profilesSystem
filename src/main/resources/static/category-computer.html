<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>计算机类 · ProfilesSystem</title>
  </head>
  <body>
    <p>正在进入计算机类学习页面……<a id="destination" href="category-detail.html?category=computer">点击继续</a></p>
    <script>
      const target = new URL("category-detail.html?category=computer", location.href);
      new URLSearchParams(location.search).forEach((value, key) => {
        if (!target.searchParams.has(key)) target.searchParams.set(key, value);
      });
      target.hash = location.hash;
      document.getElementById("destination").href = target.href;
      location.replace(target.href);
    </script>
  </body>
</html>
