<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>功能暂未开放 · ProfilesSystem</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 12% 12%,#c7d2fe 0,transparent 32%),radial-gradient(circle at 90% 86%,#fbcfe8 0,transparent 30%),linear-gradient(135deg,#eef3ff,#fbfdff 60%,#f1edff)}.panel{width:min(590px,100%);padding:48px 38px;text-align:center;border:1px solid #ffffffaa;border-radius:28px;background:#ffffffc9;box-shadow:0 25px 70px #30458e22;backdrop-filter:blur(15px);animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.icon{width:78px;height:78px;display:grid;place-items:center;margin:0 auto 22px;border-radius:25px;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899);font-size:36px;box-shadow:0 15px 30px #6366f144;animation:float 2.6s ease-in-out infinite}.eyebrow{margin:0 0 10px;color:#6366f1;font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}h1{margin:0 0 15px;font-size:clamp(29px,6vw,44px);letter-spacing:-.05em}.message{max-width:430px;margin:0 auto;color:#64748b;line-height:1.85}.reason{display:none;margin:24px auto 0;padding:15px 17px;border:1px solid #ddd6fe;border-radius:14px;color:#4338ca;background:#f5f3ff;line-height:1.7;text-align:left}.feature{display:inline-flex;margin:22px 0 28px;padding:8px 14px;border-radius:999px;color:#7c3aed;background:#f3e8ff;font-size:13px;font-weight:800}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a{padding:12px 18px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:800}.primary{color:#fff;background:linear-gradient(110deg,#6366f1,#ec4899);box-shadow:0 9px 20px #6366f144}.secondary{border:1px solid #dbe4ff;color:#4f46e5;background:#fff}.primary:hover,.secondary:hover{transform:translateY(-2px);filter:brightness(1.05)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){.panel,.icon{animation:none!important}a:hover{transform:none!important}}
  </style>
</head>
<body>
  <main class="panel">
    <div class="icon">⌁</div>
    <p class="eyebrow">Feature unavailable</p>
    <h1>这个功能还没开放</h1>
    <p class="message">管理员暂时关闭了这个功能。你可以先探索其他学习空间，开放后再回来。</p>
    <div class="feature" id="featureName">功能加载中…</div>
    <div class="reason" id="reason"></div>
    <div class="actions"><a class="primary" href="learnIndex.html">返回学习空间</a></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const feature = params.get("feature");
    const names = { community:"反馈与加入申请", notifications:"管理员通知", storage:"云端学习进度" };
    document.getElementById("featureName").textContent = names[feature] || "当前功能";
    if (feature) fetch("/api/features").then(r => r.json()).then(result => {
      const item = (result.data || []).find(x => (x.featureKey || x.feature_key) === feature);
      if (item && item.reason) { const box = document.getElementById("reason"); box.textContent = "管理员说明：" + item.reason; box.style.display = "block"; }
    }).catch(() => {});
  </script>
</body>
</html>
