<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自动化类学习导向 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 8%, #bfdbfe 0, transparent 30%), radial-gradient(circle at 94% 90%, #99f6e4 0, transparent 27%), linear-gradient(135deg, #edf5ff, #f8fafc 58%, #effcf9); animation: pageIn .45s ease-out both; }
      .page { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; animation: riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #7dd3fc, #5eead4); }
      .back { color: #0369a1; font-size: 13px; font-weight: 800; text-decoration: none; }
      .hero { padding: 70px 0 48px; }
      .eyebrow { margin: 0 0 10px; color: #0284c7; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.06em; }
      .hero p { max-width: 650px; margin: 18px 0 0; color: #64748b; line-height: 1.8; }
      .section-title { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
      .section-title h2 { margin: 0; font-size: 21px; }
      .section-title span { color: #64748b; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .route { position: relative; min-height: 270px; padding: 28px; border: 1px solid #0ea5e9; border-radius: 21px; background: #ffffffdf; box-shadow: 0 0 0 4px #0ea5e91c, 0 18px 42px #155e7518; transition: .25s; }
      .route { cursor: pointer; }
      .route.wide { grid-column: 1 / -1; }
      .route:hover { transform: translateY(-5px); box-shadow: 0 0 0 4px #0ea5e929, 0 24px 50px #155e7524; }
      .route.card-enter { animation: cardIn .45s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: var(--card-delay, 0ms); }
      @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .route-icon { display: grid; width: 49px; height: 49px; place-items: center; border-radius: 15px; color: #0369a1; background: #e0f2fe; font-size: 23px; }
      .route h3 { margin: 23px 0 10px; font-size: 23px; }
      .route p { max-width: 620px; margin: 0; color: #64748b; line-height: 1.8; font-size: 14px; }
      .route a { display: inline-block; margin-top: 25px; color: #0284c7; font-size: 13px; font-weight: 800; text-decoration: none; }
      .tag { position: absolute; top: 22px; right: 22px; padding: 5px 9px; border: 1px solid #67e8f9; border-radius: 999px; color: #0e7490; background: #ecfeff; font-size: 11px; font-weight: 800; }
      .selectBox { position: relative; z-index: 10; width: 280px; margin: 0 0 22px; }
      .selectBox-trigger { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border: 1.5px solid #d8edf5; border-radius: 14px; color: #1f2333; background: #fff; box-shadow: 0 1px 2px #14193c0a; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
      .selectBox-trigger:hover { border-color: #7dd3fc; }
      .selectBox.is-open .selectBox-trigger { border-color: #0ea5e9; box-shadow: 0 0 0 4px #0ea5e929; }
      .selectBox-arrow { flex: none; color: #8e95ad; transition: transform .25s cubic-bezier(.2,.9,.3,1.3); }
      .selectBox.is-open .selectBox-arrow { transform: rotate(180deg); color: #0284c7; }
      .selectBox-menu { position: absolute; top: calc(100% + 8px); right: 0; left: 0; margin: 0; padding: 6px; border: 1px solid #e0f2fe; border-radius: 16px; list-style: none; background: #fff; box-shadow: 0 18px 40px -12px #155e7547, 0 4px 12px #155e750f; opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.98); transform-origin: top; transition: opacity .18s, transform .18s cubic-bezier(.2,.9,.3,1.15), visibility .18s; }
      .selectBox.is-open .selectBox-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
      .selectBox-option { padding: 10px 12px; border-radius: 10px; color: #3b4157; font-size: 14.5px; cursor: pointer; user-select: none; }
      .selectBox-option:hover, .selectBox-option.is-active { color: #0369a1; background: #ecfeff; }
      .selectBox-option[aria-selected="true"] { color: #0369a1; background: #f0f9ff; font-weight: 600; }
      .selectBox-option[aria-selected="true"]::after { content: "✓"; float: right; color: #0284c7; }
      .foot { margin-top: 40px; color: #94a3b8; font-size: 12px; }
      @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 680px) { .page { width: min(100% - 22px, 560px); padding-top: 18px; } .hero { padding: 56px 0 40px; } .section-title { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .selectBox { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { body, .page { animation: none; } .route { transition: none; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · 自动化类专业</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="hero"><p class="eyebrow">Automation engineering routes</p><h1>让系统自己稳稳地跑起来</h1><p>从控制理论、传感器与执行机构出发，逐步连接工业网络、机器人和智能控制，理解信息如何变成可靠动作。</p></section>
      <section>
        <div class="section-title"><h2>学习导向</h2><span>选择路线方向与具体专业</span></div>
        <div class="selectBox" id="contentModeBox"><button class="selectBox-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="selectBox-value">路线方向</span><svg class="selectBox-arrow" width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="selectBox-menu" role="listbox" aria-label="学习导向"><li class="selectBox-option" role="option" tabindex="-1" data-value="route" aria-selected="true">路线方向</li><li class="selectBox-option" role="option" tabindex="-1" data-value="major" aria-selected="false">具体专业</li></ul><input type="hidden" id="contentMode" value="route" /></div>
        <div class="grid" id="cardGrid"></div>
      </section>
      <p class="foot">ProfilesSystem · 自动化类专业学习空间</p>
    </main>
    <script>
      const contentMode = document.getElementById("contentMode");
      const cardGrid = document.getElementById("cardGrid");
      const sectionHint = document.querySelector(".section-title span");
      const cardData = {
        route: [{ icon: "⌁", title: "通用就业路线", description: "覆盖控制基础、传感与检测、PLC、工业网络、系统调试和智能控制实践，建立面向自动化岗位的通用能力。", href: "learnautomation.html", action: "进入就业路线", wide: true }],
        major: [
          { icon: "A", title: "自动化", description: "关注控制理论、检测技术、系统集成与工程实践。", major: "automation" },
          { icon: "≋", title: "轨道交通信号与控制", description: "面向轨道交通信号、运行控制与安全系统。", major: "rail-transit-control" },
          { icon: "⌁", title: "机器人工程", description: "融合机械、控制、感知、规划与智能算法。", major: "robot-engineering" },
          { icon: "▣", title: "智能装备与系统", description: "关注智能装备设计、系统集成和协同控制。", major: "intelligent-equipment" },
          { icon: "✦", title: "工业智能", description: "连接工业数据、人工智能与生产系统优化。", major: "industrial-intelligence" },
          { icon: "◎", title: "核电技术与控制工程", description: "关注核电系统、仪控技术、安全与可靠运行。", major: "nuclear-control" },
        ],
      };
      function renderCards() {
        const mode = contentMode.value;
        sectionHint.textContent = mode === "route" ? "选择一条路线开始学习" : "选择你的自动化类具体专业";
        cardGrid.innerHTML = cardData[mode].map(item => { const href = item.href || `majorDemo.html?title=${encodeURIComponent(item.title)}&return=learnautomationindex.html`; return `<article class="route${item.wide ? " wide" : ""}"><span class="tag">公开</span><div class="route-icon">${item.icon}</div><h3>${item.title}</h3><p>${item.description}</p><a href="${href}">${item.action || "查看专业导向"} →</a></article>`; }).join("");
        cardGrid.querySelectorAll(".route").forEach((card, index) => { card.style.setProperty("--card-delay", `${index * 55}ms`); card.classList.add("card-enter"); });
      }
      const contentModeBox = document.getElementById("contentModeBox");
      const modeTrigger = contentModeBox.querySelector(".selectBox-trigger");
      const modeValue = contentModeBox.querySelector(".selectBox-value");
      const modeOptions = Array.from(contentModeBox.querySelectorAll(".selectBox-option"));
      function closeModeMenu() { contentModeBox.classList.remove("is-open"); modeTrigger.setAttribute("aria-expanded", "false"); }
      function chooseMode(option) { modeOptions.forEach(item => item.setAttribute("aria-selected", String(item === option))); contentMode.value = option.dataset.value; modeValue.textContent = option.textContent.trim(); closeModeMenu(); renderCards(); }
      modeTrigger.addEventListener("click", () => { const opening = !contentModeBox.classList.contains("is-open"); contentModeBox.classList.toggle("is-open", opening); modeTrigger.setAttribute("aria-expanded", String(opening)); if (opening) modeOptions.find(item => item.getAttribute("aria-selected") === "true")?.focus(); });
      modeOptions.forEach(option => { option.addEventListener("click", () => chooseMode(option)); option.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") chooseMode(option); if (event.key === "Escape") { closeModeMenu(); modeTrigger.focus(); } }); });
      document.addEventListener("click", event => { if (!contentModeBox.contains(event.target)) closeModeMenu(); });
      cardGrid.addEventListener("click", event => { if (event.target.closest("a")) return; const link = event.target.closest(".route")?.querySelector("a[href]"); if (link) link.click(); });
      renderCards();
    </script>
  </body>
</html>
