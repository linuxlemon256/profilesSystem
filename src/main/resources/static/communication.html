<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>交流中心 · ProfilesSystem</title>
  <style>
    :root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3ff,#f8fafc 58%,#f1edff)}.page{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#9ca9ff,#62e4d5);color:#111a3b}.top a{color:#4f46e5;text-decoration:none;font-size:13px;font-weight:700}.hero{padding:62px 0 32px}.eyebrow{margin:0 0 10px;color:#4f46e5;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,6vw,54px);letter-spacing:-.06em}.hero p{color:#64748b;line-height:1.8}.thread{margin-top:18px;padding:22px;border:1px solid #dce5f5;border-radius:20px;background:#ffffffd9;box-shadow:0 14px 35px #30458e12}.thread-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.thread-head h2{margin:0;font-size:18px}.thread-id{color:#94a3b8;font-size:12px}.messages{display:flex;flex-direction:column;gap:10px;margin:18px 0;max-height:360px;overflow:auto}.bubble{max-width:78%;padding:12px 14px;border-radius:14px;background:#eef2ff;color:#334155;line-height:1.65;font-size:14px}.bubble.admin{align-self:flex-start;background:#ede9fe}.bubble.user{align-self:flex-end;background:#4f46e5;color:#fff}.bubble small{display:block;margin-top:5px;opacity:.65;font-size:11px}.reply{display:flex;gap:10px}.reply textarea{flex:1;min-height:46px;padding:11px 12px;border:1px solid #dbe3f2;border-radius:11px;resize:vertical;font:inherit;outline:none}.reply textarea:focus{border-color:#818cf8;box-shadow:0 0 0 3px #6366f126}.reply button{padding:0 18px;border:0;border-radius:11px;background:#4f46e5;color:white;font-weight:800;cursor:pointer}.empty,.error{padding:26px;text-align:center;color:#64748b}.error{color:#b91c1c}.back{display:inline-block;margin-top:25px;color:#4f46e5;text-decoration:none;font-size:13px;font-weight:700}@media(max-width:600px){.page{width:min(100% - 22px,560px)}.hero{padding:44px 0 20px}.thread{padding:16px}.reply{flex-direction:column}.reply button{padding:12px}.bubble{max-width:90%}}
  </style>
</head>
<body><main class="page"><header class="top"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><a href="learnIndex.html">返回学习空间</a></header><section class="hero"><p class="eyebrow">Communication center</p><h1>交流中心</h1><p>在这里查看申请和反馈的回复，也可以继续补充信息。它会作为后续更多交流功能的统一入口。</p></section><div id="content"><div class="empty">正在加载交流记录…</div></div><a class="back" href="account.html">返回账户主页 →</a></main>
<script>
  const content=document.getElementById('content');
  const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const time=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleString('zh-CN',{hour12:false})};
  async function load(){
    try{const r=await fetch('/api/community/messages');const j=await r.json();if(j.code===401){location.href='login.html?redirect=communication.html';return}if(j.code!==200)throw Error(j.message||'加载失败');
      const groups={};(j.data||[]).forEach(m=>(groups[m.requestId]??=[]).push(m));
      const ids=Object.keys(groups); if(!ids.length){content.innerHTML='<div class="empty">暂时还没有交流记录。提交反馈或加入申请后，回复会显示在这里。</div>';return}
      content.innerHTML=ids.map(id=>`<section class="thread"><div class="thread-head"><h2>申请 #${id}</h2><span class="thread-id">交流记录</span></div><div class="messages">${groups[id].map(m=>`<div class="bubble ${m.senderType==='ADMIN'?'admin':'user'}">${escapeHtml(m.content)}<small>${escapeHtml(m.senderName)} · ${time(m.createdAt)}</small></div>`).join('')}</div><form class="reply" data-id="${id}"><textarea maxlength="2000" placeholder="继续补充信息…" required></textarea><button type="submit">发送</button></form></section>`).join('');
      content.querySelectorAll('form.reply').forEach(f=>f.addEventListener('submit',send));
    }catch(e){content.innerHTML=`<div class="error">${escapeHtml(e.message||'加载失败，请稍后重试')}</div>`}
  }
  async function send(e){e.preventDefault();const f=e.currentTarget,b=f.querySelector('textarea'),button=f.querySelector('button');button.disabled=true;try{const r=await fetch('/api/community/'+f.dataset.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:b.value})});const j=await r.json();if(j.code!==200)throw Error(j.message||'发送失败');await load()}catch(err){alert(err.message||'发送失败')}finally{button.disabled=false}}
  load();
</script></body></html>
