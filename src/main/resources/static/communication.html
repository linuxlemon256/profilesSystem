<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交流中心 · ProfilesSystem</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3ff,#fbfdff 60%,#f1edff)}.page{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a5b4fc,#5eead4);color:#111a3b}.top a,.back{color:#4f46e5;text-decoration:none;font-size:13px;font-weight:750}.hero{padding:54px 0 26px}.eyebrow{margin:0 0 10px;color:#6366f1;font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,6vw,58px);letter-spacing:-.06em}.hero p{color:#64748b;line-height:1.8}.layout{display:grid;grid-template-columns:310px 1fr;gap:18px}.panel,.chat{border:1px solid #dce5f5;border-radius:22px;background:#ffffffdd;box-shadow:0 16px 40px #30458e13}.panel{padding:18px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:10px;border:0;border-radius:10px;background:#eef2ff;color:#64748b;font-weight:800;cursor:pointer}.tab.active{background:#4f46e5;color:#fff}.list{display:flex;flex-direction:column;gap:8px}.item{padding:13px;border:1px solid #e2e8f0;border-radius:13px;background:#fff;text-align:left;cursor:pointer;width:100%}.item:hover,.item.selected{border-color:#818cf8;background:#f5f3ff}.item strong{display:block;font-size:14px}.item small{display:block;margin-top:5px;color:#94a3b8}.chat{display:flex;min-height:530px;flex-direction:column;overflow:hidden}.chat-head{padding:18px 20px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.chat-head h2{margin:0;font-size:18px}.badge{font-size:11px;color:#4f46e5;background:#eef2ff;padding:6px 9px;border-radius:999px}.messages{flex:1;display:flex;flex-direction:column;gap:10px;padding:20px;overflow:auto;max-height:450px}.bubble{max-width:76%;padding:11px 13px;border-radius:15px;background:#eef2ff;line-height:1.6;font-size:14px}.bubble.mine{align-self:flex-end;background:#4f46e5;color:#fff}.bubble small{display:block;margin-top:4px;opacity:.6;font-size:11px}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid #e2e8f0}.composer textarea{flex:1;min-height:44px;padding:11px;border:1px solid #dbe3f2;border-radius:12px;resize:vertical;font:inherit}.composer button,.friend-tools button{border:0;border-radius:11px;background:#4f46e5;color:#fff;font-weight:800;padding:0 18px;cursor:pointer}.empty{padding:30px 10px;text-align:center;color:#94a3b8;line-height:1.8}.friend-tools{display:flex;gap:7px;margin-bottom:12px}.friend-tools input{width:100%;padding:10px;border:1px solid #dbe3f2;border-radius:10px}.back{display:inline-block;margin-top:20px}@media(max-width:780px){.layout{grid-template-columns:1fr}.panel{order:2}.chat{min-height:560px}.hero{padding-top:38px}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><a href="learnIndex.html">返回学习空间</a></header><section class="hero"><p class="eyebrow">Communication center · 关联</p><h1>把问题说出来，一起往前走。</h1><p>学习组负责共同学习，好友负责一对一交流。这里不开放自定义群聊，让每段关系都有清晰的边界。</p></section><section class="layout"><aside class="panel"><div class="tabs"><button class="tab active" data-tab="groups">学习组</button><button class="tab" data-tab="friends">好友</button></div><div id="tools"></div><div class="list" id="list"><div class="empty">加载中…</div></div></aside><section class="chat"><header class="chat-head"><h2 id="chatTitle">选择一个学习组或好友</h2><span class="badge" id="chatBadge">交流中心</span></header><div class="messages" id="messages"><div class="empty">从左侧选择一个对象，开始交流。</div></div><form class="composer" id="composer"><textarea id="content" maxlength="2000" placeholder="写下你的消息…" disabled required></textarea><button id="send" disabled>发送</button></form></section></section><a class="back" href="account.html">← 返回账户主页</a></main><script>
const list=document.querySelector('#list'),tools=document.querySelector('#tools'),messages=document.querySelector('#messages'),title=document.querySelector('#chatTitle'),badge=document.querySelector('#chatBadge'),composer=document.querySelector('#composer'),content=document.querySelector('#content'),send=document.querySelector('#send');let tab='groups',current=null,currentUser='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async(u,o)=>{const r=await fetch(u,o),j=await r.json();if(j.code===401){location.href='login.html?redirect=communication.html';throw Error('请先登录')}if(j.code!==200)throw Error(j.message||'请求失败');return j.data};function draw(items){list.innerHTML=items.length?items.map(x=>`<button class="item ${current&&current.id===x.id?'selected':''}" data-id="${x.id}" data-name="${esc(x.name)}"><strong>${esc(x.name)}</strong><small>${esc(x.meta||'')}</small></button>`).join(''):'<div class="empty">还没有内容。<br>先加入学习组，或添加一位好友。</div>'}async function load(){try{if(tab==='groups'){tools.innerHTML='<div class="empty">学习组创建需先提交申请，入口在学习组页面。</div>';const gs=await api('/api/groups');draw((gs||[]).map(g=>({id:'g'+g.id,name:g.name,meta:(g.memberCount||0)+' 位成员 · '+(g.ownerUsername||'')})))}else{tools.innerHTML='<div class="friend-tools"><input id="friendName" placeholder="输入账户名称"><button id="addFriend">添加</button></div>';const fs=await api('/api/social/friends');draw((fs||[]).map(f=>({id:'f'+f.username,name:f.username,meta:f.status==='ACCEPTED'?'已成为好友':f.status==='PENDING'?'等待确认':'待处理'})));document.querySelector('#addFriend').onclick=async()=>{try{await api('/api/social/friends/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#friendName').value})});alert('好友申请已发送');load()}catch(e){alert(e.message)}}}}catch(e){list.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function loadMessages(){const u=current.id[0]==='g'?'/api/social/groups/'+current.id.slice(1)+'/messages':'/api/social/direct/'+encodeURIComponent(current.id.slice(1));const ms=await api(u);messages.innerHTML=(ms||[]).map(m=>`<div class="bubble ${m.senderUsername===currentUser?'mine':''}">${esc(m.content)}<small>${esc(m.senderUsername)} · lv${m.senderLevel||0} · ${new Date(m.createdAt).toLocaleString('zh-CN',{hour12:false})}</small></div>`).join('')||'<div class="empty">还没有消息，发出第一句吧。</div>';messages.scrollTop=messages.scrollHeight}list.onclick=async e=>{const i=e.target.closest('.item');if(!i)return;current={id:i.dataset.id,name:i.dataset.name};title.textContent=current.name;badge.textContent=current.id[0]==='g'?'学习组聊天':'好友私聊';content.disabled=false;send.disabled=false;await loadMessages();document.querySelectorAll('.item').forEach(x=>x.classList.toggle('selected',x===i))};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;current=null;title.textContent='选择一个学习组或好友';badge.textContent='交流中心';content.disabled=true;send.disabled=true;messages.innerHTML='<div class="empty">从左侧选择一个对象，开始交流。</div>';load()});composer.onsubmit=async e=>{e.preventDefault();if(!current||!content.value.trim())return;const u=current.id[0]==='g'?'/api/social/groups/'+current.id.slice(1)+'/messages':'/api/social/direct/'+encodeURIComponent(current.id.slice(1));try{await api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:content.value})});content.value='';await loadMessages()}catch(err){alert(err.message)}};(async()=>{try{const u=await api('/api/user/me');currentUser=u.username;await load()}catch(e){}})();</script></body></html>
