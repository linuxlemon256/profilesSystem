<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问题反馈 · ProfilesSystem</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3ff,#fff 55%,#fce7f3)}.page{width:min(760px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a5b4fc,#5eead4);color:#111a3b}.top a,.back{color:#4f46e5;text-decoration:none;font-size:13px;font-weight:800}.hero{padding:60px 0 25px}.eyebrow{margin:0 0 10px;color:#ec4899;font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(34px,7vw,56px);letter-spacing:-.06em}.hero p{color:#64748b;line-height:1.8}.card{padding:25px;border:1px solid #dbe4ff;border-radius:22px;background:#ffffffdc;box-shadow:0 18px 40px #30458e15}.field{margin-top:15px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dbe3f2;border-radius:11px;outline:none;font:inherit}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#ec4899;box-shadow:0 0 0 4px #ec489922}.submit{margin-top:20px;padding:12px 17px;border:0;border-radius:11px;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899);font-weight:850;cursor:pointer}.submit:disabled{opacity:.55}.status{display:none;margin-top:14px;padding:11px;border-radius:10px;color:#4338ca;background:#f5f3ff;line-height:1.7}.status.show{display:block}.back{display:inline-block;margin-top:22px}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}.hero,.card{animation:rise .55s both}@media(prefers-reduced-motion:reduce){.hero,.card{animation:none!important}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><a href="learnIndex.html">返回学习空间</a></header><section class="hero"><p class="eyebrow">Make it better</p><h1>问题反馈</h1><p>发现页面问题、内容错误或有更好的建议？告诉我们，我们会认真看。</p></section><section class="card"><form id="form"><div class="field"><label>称呼</label><input name="name" maxlength="40" placeholder="怎么称呼你？" required></div><div class="field"><label>联系邮箱</label><input name="contact" type="email" maxlength="120" placeholder="用于接收回复" required></div><div class="field"><label>反馈类型</label><select name="category"><option>页面问题</option><option>内容建议</option><option>功能建议</option><option>其他</option></select></div><div class="field"><label>具体内容</label><textarea name="message" maxlength="1000" placeholder="请尽量描述清楚" required></textarea></div><div class="status" id="status"></div><button class="submit" type="submit">提交反馈</button></form></section><a class="back" href="learnIndex.html">← 返回学习空间</a></main><script>const form=document.getElementById('form'),status=document.getElementById('status');form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(form));data.requestType='feedback';const r=await fetch('/api/community/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(j.code!==200)throw Error(j.message||'提交失败');status.textContent='反馈已提交，管理员回复会出现在通知中心。';status.classList.add('show');form.reset()}catch(e){status.textContent=e.message||'提交失败，请稍后再试';status.classList.add('show')}finally{b.disabled=false}};</script></body></html>
