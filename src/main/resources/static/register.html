<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>申请账户 · ProfilesSystem</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#eef2ff;background:#090d1d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#3947a8 0,transparent 32%),radial-gradient(circle at 90% 90%,#0e7490 0,transparent 30%),#090d1d}.shell{width:min(900px,94vw);display:grid;grid-template-columns:1.05fr 1fr;overflow:hidden;border:1px solid #ffffff1c;border-radius:28px;background:#ffffff0b;box-shadow:0 28px 90px #0008;backdrop-filter:blur(22px)}.intro{padding:56px 48px;background:linear-gradient(145deg,#ffffff16,#ffffff03)}.brand{display:flex;gap:12px;align-items:center;font-weight:700}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#9ca9ff,#62e4d5);color:#111a3b;font-weight:900}.intro h1{margin:95px 0 16px;font-size:42px;line-height:1.15;letter-spacing:-.04em}.intro p{color:#b8c1e0;line-height:1.8}.form{padding:56px 11%;background:#090d1db8}.eyebrow{margin:0 0 12px;color:#7eebdc;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.form h2{margin:0 0 10px;font-size:30px}.sub{margin:0 0 32px;color:#9da7c8}.notice{padding:13px 14px;margin-bottom:24px;border:1px solid #7eebdc33;border-radius:12px;background:#7eebdc0d;color:#a9e8e0;font-size:13px;line-height:1.6}.method-label{margin-top:22px;margin-bottom:10px;color:#7eebdc;font-size:12px;font-weight:700;letter-spacing:.08em}.apply-form{display:flex;flex-direction:column;gap:14px;margin-top:22px}.apply-form label{display:flex;flex-direction:column;gap:7px;color:#cbd3ef;font-size:13px}.apply-form input,.apply-form textarea{width:100%;padding:13px 14px;border:1px solid #ffffff20;border-radius:11px;outline:none;background:#ffffff0b;color:#fff;font:inherit;resize:vertical}.apply-form input:focus,.apply-form textarea:focus{border-color:#7eebdc;box-shadow:0 0 0 4px #7eebdc18}.apply-form textarea{min-height:86px}.apply-btn{padding:14px;border:0;border-radius:11px;background:linear-gradient(100deg,#9ca9ff,#62e4d5);color:#111a3b;font-weight:800;cursor:pointer}.apply-btn:hover{box-shadow:0 10px 22px #62e4d544;transform:translateY(-1px)}.success{display:none;margin-top:22px;padding:18px;border:1px solid #7eebdc55;border-radius:14px;background:#7eebdc12;color:#c8fff6;line-height:1.7}.success.show{display:block}.back-btn{display:inline-block;margin-top:14px;padding:10px 14px;border-radius:10px;background:#ffffff12;color:#cbd3ef;text-decoration:none}.back-btn:hover{background:#ffffff22;color:#fff}.contact{display:flex;flex-direction:column;gap:9px;padding:16px;margin-top:18px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08;font-size:13px}.contact strong{color:#eef2ff;font-size:14px}.contact span{color:#8792ba;font-size:12px;margin-bottom:3px}.contact a{color:#a9e8e0;text-decoration:none}.contact a:hover{color:#fff}.links{display:flex;justify-content:space-between;margin-top:24px;font-size:13px}.links a{color:#b8c1e0;text-decoration:none}.links a:hover{color:#7eebdc}@media(max-width:700px){.shell{grid-template-columns:1fr}.intro{padding:34px 28px}.intro h1{margin:50px 0 14px;font-size:34px}.form{padding:36px 28px 42px}}
</style></head><body><main class="shell"><section class="intro"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><h1>申请你的<br>专属空间。</h1><p>这是一个面向内部成员的学习与资料空间。申请前请先阅读访问说明，并联系管理员获取授权。</p></section><section class="form"><p class="eyebrow">Request access</p><h2>申请账户</h2><p class="sub">当前空间暂不开放公开注册</p><div class="notice">登录仅提供云端存储功能和《大模型教学手册》访问权限。内部资源暂不对外开放。</div><div class="method-label">方式一 · 填写申请表单</div><form class="apply-form" id="applyForm"><label for="applyName">账户名称<input id="applyName" name="name" type="text" placeholder="请输入希望使用的账户名称" required></label><label for="applyReason">申请原因<textarea id="applyReason" name="reason" placeholder="请简要说明你的使用场景或申请原因" required></textarea></label><label for="applyContact">联系方式 <span style="color:#8792ba;font-size:12px">（可选，推荐填写邮箱）</span><input id="applyContact" name="contact" type="text" placeholder="例如：name@example.com"></label><button class="apply-btn" type="submit">提交申请</button></form><div class="success" id="applySuccess">申请信息已提交。请耐心等待 <strong>1–3 个工作日</strong>，我们会通过你留下的联系方式与你联系。<br><a class="back-btn" href="learnServer.html">返回学习路线</a></div><div class="contact"><strong>其他申请方式</strong><span>方式二 · 邮箱联系　　方式三 · GitHub 联系</span><a href="mailto:297761464@qq.com">✉ 297761464@qq.com</a><a href="https://github.com/linuxlemon256" target="_blank" rel="noopener noreferrer">⌘ GitHub / linuxlemon256 ↗</a></div><div class="links"><a href="login.html">已有账户？去登录</a><a href="index.html">返回首页</a></div></section></main><script>document.getElementById("applyForm").addEventListener("submit",function(event){event.preventDefault();this.style.display="none";document.getElementById("applySuccess").classList.add("show")})</script></body></html>
