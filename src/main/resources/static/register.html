<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>申请账户 · ProfilesSystem</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <main class="shell">
      <section class="intro">
        <div class="brand">
          <span class="mark">P</span><span>ProfilesSystem</span>
        </div>
        <h1>申请你的<br />专属空间。</h1>
        <p>
          这是一个面向内部成员的学习与资料空间。申请前请先阅读访问说明，并联系管理员获取授权。
        </p>
      </section>
      <section class="form">
        <p class="eyebrow">Request access</p>
        <h2>申请账户</h2>
        <p class="sub">当前空间暂不开放公开注册</p>
        <div class="notice">
          登录仅提供云端存储功能和《大模型教学手册》访问权限。内部资源暂不对外开放。
        </div>
        <div class="method-label">方式一 · 填写申请表单</div>
        <form class="apply-form" id="applyForm">
          <label for="applyName"
            >账户名称<input
              id="applyName"
              name="name"
              type="text"
              placeholder="请输入希望使用的账户名称"
              required /></label
          ><label for="applyReason"
            >申请原因<textarea
              id="applyReason"
              name="reason"
              placeholder="请简要说明你的使用场景或申请原因（不超过 255 字）"
              maxlength="255"
              required
            ></textarea></label
          ><label for="applyContact"
            >联系方式
            <span style="color: #8792ba; font-size: 12px">（邮箱）</span
            ><input
              id="applyContact"
              name="contact"
              type="text"
              required
              placeholder="例如：name@example.com" /></label
          ><button class="apply-btn" type="submit">提交申请</button>
        </form>
        <div class="error" id="applyError"></div>
        <div class="success" id="applySuccess">
          申请信息已提交。请耐心等待
          <strong>1–3 个工作日</strong
          >，我们会通过你留下的联系方式与你联系。<br /><a
            class="back-btn"
            href="learnServer.html"
            >返回学习路线</a
          >
        </div>
        <div class="contact">
          <strong>其他申请方式</strong
          ><span>方式二 · 邮箱联系　　方式三 · GitHub 联系</span
          ><a href="mailto:297761464@qq.com">✉ 297761464@qq.com</a
          ><a
            href="https://github.com/linuxlemon256"
            target="_blank"
            rel="noopener noreferrer"
            >⌘ GitHub / linuxlemon256 ↗</a
          >
        </div>
        <div class="links">
          <a href="login.html">已有账户？去登录</a
          ><a href="learnServer.html">返回首页</a>
        </div>
      </section>
    </main>
    <script src="register.js" defer></script>
  </body>
</html>
