<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>权限不足 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #edf2ff; background: #0b1020; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 18% 18%, #5366ce55, transparent 34%), radial-gradient(circle at 84% 80%, #7c3aed44, transparent 32%), #0b1020; }
      .panel { width: min(560px, 100%); padding: 52px 44px; text-align: center; border: 1px solid #ffffff1a; border-radius: 28px; background: #ffffff0b; box-shadow: 0 28px 80px #0008; backdrop-filter: blur(18px); }
      .icon { width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center; border: 1px solid #c4b5fd66; border-radius: 24px; background: #8b5cf622; color: #c4b5fd; font-size: 38px; }
      .eyebrow { margin: 0 0 12px; color: #a5b4fc; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: clamp(28px, 6vw, 42px); letter-spacing: -.04em; }
      .message { margin: 0 auto; max-width: 390px; color: #b9c3df; line-height: 1.8; }
      .level { display: inline-flex; margin: 24px 0 30px; padding: 8px 14px; border: 1px solid #a5b4fc44; border-radius: 999px; color: #c4b5fd; background: #8b5cf614; font-size: 13px; }
      .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
      a { padding: 12px 18px; border-radius: 12px; color: #edf2ff; text-decoration: none; font-size: 14px; }
      .primary { background: linear-gradient(110deg, #a5b4fc, #67e8f9); color: #111827; font-weight: 800; }
      .secondary { border: 1px solid #ffffff20; background: #ffffff0a; }
      .secondary:hover { border-color: #a5b4fc88; }
    </style>
    <style id="profiles-motion">
    @keyframes profilesPageIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes profilesRiseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    body { animation: profilesPageIn .45s ease-out both; }
    body > main, body > .page, body > .shell { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    a, button, input, textarea, select { transition: color .2s ease, background-color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .2s ease, opacity .2s ease; }
    a:hover { filter: brightness(1.04); }
    button:hover:not(:disabled) { transform: translateY(-2px); }
    input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 3px #6366f126; }
    article, .card, .panel, .stat, .hero, .section, .box { animation: profilesRiseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) {
      body, body > main, body > .page, body > .shell, article, .card, .panel, .stat, .hero, .section, .box { animation: none !important; }
      a, button, input, textarea, select { transition: none !important; }
    }
  </style></head>
  <body>
    <main class="panel">
      <div class="icon" aria-hidden="true">⌁</div>
      <p class="eyebrow">Access restricted</p>
      <h1>当前权限不足</h1>
      <p class="message" id="message">这个页面需要更高的账户等级。请先完成账户申请，或联系管理员升级权限。</p>
      <div class="level" id="level">需要更高等级</div>
      <div class="actions">
        <a class="primary" href="learnIndex.html">返回专业资源</a>
        <a class="secondary" href="account.html">查看账户</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const required = params.get("required");
      const labels = { "1": "需要关联人员等级", "2": "需要内部人员等级" };
      if (required && labels[required]) document.getElementById("level").textContent = labels[required];
      if (params.get("resource") === "llm") {
        document.getElementById("message").textContent = "LLM 学习助手仅对具有关联关系的账户开放。";
      }
    </script>
  </body>
</html>
