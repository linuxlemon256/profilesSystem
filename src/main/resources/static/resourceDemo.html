<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>资源页面整理中 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 12% 9%, #bae6fd 0, transparent 30%), radial-gradient(circle at 91% 88%, #bbf7d0 0, transparent 27%), linear-gradient(135deg, #eff6ff, #f8fafc 58%, #ecfdf5); }
      .box { width: min(660px, 100%); padding: clamp(34px, 7vw, 54px); border: 1px solid #bae6fd; border-radius: 28px; text-align: center; background: #ffffffdf; box-shadow: 0 22px 60px #0e74901a; animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
      .mark { display: grid; width: 62px; height: 62px; place-items: center; margin: 0 auto 20px; border-radius: 20px; color: #fff; background: linear-gradient(135deg, #0284c7, #10b981); font-size: 27px; }
      .kind { display: inline-flex; padding: 6px 10px; border: 1px solid #67e8f9; border-radius: 999px; color: #0e7490; background: #ecfeff; font-size: 11px; font-weight: 900; letter-spacing: .08em; }
      h1 { margin: 18px 0 12px; font-size: clamp(30px, 6vw, 46px); letter-spacing: -.05em; }
      .subject { color: #0284c7; }
      p { max-width: 470px; margin: 0 auto; color: #64748b; line-height: 1.85; }
      .steps { display: flex; justify-content: center; gap: 7px; margin: 26px 0 20px; }
      .steps i { width: 8px; height: 8px; border-radius: 50%; background: #06b6d4; animation: pulse 1.1s infinite ease-in-out; }
      .steps i:nth-child(2) { animation-delay: .15s; } .steps i:nth-child(3) { animation-delay: .3s; }
      .back { display: inline-flex; padding: 12px 17px; border-radius: 11px; color: #0369a1; background: #e0f2fe; font-size: 13px; font-weight: 800; text-decoration: none; transition: .2s; }
      .back:hover { transform: translateY(-2px); background: #bae6fd; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes pulse { 0%,80%,100% { opacity: .35; transform: scale(.65); } 40% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .box, .steps i { animation: none; } }
    </style>
  </head>
  <body>
    <main class="box">
      <div class="mark">▤</div><span class="kind">资源通用页</span>
      <h1><span class="subject" id="subject">这份资源</span><br />正在整理装订</h1>
      <p>内容筛选、来源核对和访问方式正在统一整理。准备妥当后，这里会直接呈现可用资料与清晰说明。</p>
      <div class="steps" aria-label="资源页面整理中"><i></i><i></i><i></i></div>
      <a class="back" id="backLink" href="learnIndex.html">← 返回资源选择</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const title = (params.get("title") || "这份资源").slice(0, 60);
      const returnPage = params.get("return") || "learnIndex.html";
      document.getElementById("subject").textContent = title;
      document.title = title + " · 资源页面整理中";
      if (/^[a-zA-Z0-9_-]+\.html$/.test(returnPage)) document.getElementById("backLink").href = returnPage;
    </script>
  </body>
</html>
