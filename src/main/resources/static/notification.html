<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知中心 · ProfilesSystem</title><style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172554;background:#eef3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef3ff,#fbfdff 60%,#f1edff)}.page{width:min(820px,calc(100% - 28px));margin:auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#a5b4fc,#5eead4);color:#111a3b}.top a,.back{color:#4f46e5;text-decoration:none;font-size:13px;font-weight:800}.hero{padding:62px 0 28px}.eyebrow{margin:0 0 10px;color:#6366f1;font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(36px,7vw,58px);letter-spacing:-.06em}.hero p{color:#64748b;line-height:1.8}.list{display:flex;flex-direction:column;gap:12px}.notice{padding:18px;border:1px solid #dbe4ff;border-radius:18px;background:#ffffffd9;box-shadow:0 12px 30px #30458e12}.notice.unread{border-color:#a5b4fc;background:linear-gradient(135deg,#fff,#f5f3ff)}.notice strong{display:block;line-height:1.7}.notice small{display:block;margin-top:8px;color:#94a3b8}.read{margin-top:12px;padding:8px 11px;border:0;border-radius:9px;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899);font-weight:800;cursor:pointer}.empty{padding:35px;text-align:center;color:#94a3b8}.back{display:inline-block;margin-top:24px}@keyframes rise{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}.hero,.notice{animation:rise .55s both}.notice:nth-child(2){animation-delay:.06s}.notice:nth-child(3){animation-delay:.12s}@media(prefers-reduced-motion:reduce){.hero,.notice{animation:none!important}}
</style></head><body><main class="page"><header class="top"><div class="brand"><span class="mark">P</span><span>ProfilesSystem</span></div><a href="learnIndex.html">返回学习空间</a></header><section class="hero"><p class="eyebrow">Notification center</p><h1>通知中心</h1><p>管理员回复、功能安排和重要提醒都会集中显示在这里。</p></section><section class="list" id="list"><div class="empty">正在加载通知…</div></section><a class="back" href="communication.html">← 返回交流中心</a></main><script>const list=document.getElementById('list'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/notifications'),j=await r.json();if(j.code===401){location.href='login.html?redirect=notification.html';return}if(j.code!==200)throw Error(j.message||'加载失败');list.innerHTML=(j.data||[]).map(n=>`<article class="notice ${n.readStatus?'':'unread'}"><strong>${n.readStatus?'':'【未读】'}${esc(n.content)}</strong><small>${esc(n.senderName||'管理员')} · ${new Date(n.createdAt).toLocaleString('zh-CN',{hour12:false})}</small>${n.readStatus?'':`<button class="read" data-id="${n.id}">标记已读</button>`}</article>`).join('')||'<div class="empty">暂时没有通知。</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await fetch('/api/notifications/'+b.dataset.id+'/read',{method:'POST'});load()})}catch(e){list.innerHTML='<div class="empty">'+esc(e.message||'加载失败')+'</div>'}}load();</script></body></html>
