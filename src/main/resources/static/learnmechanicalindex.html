<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>页面地址已更新 · ProfilesSystem</title>
    <link rel="canonical" href="category-mechanical.html" />
  </head>
  <body>
    <p>正在进入页面……<a id="destination" href="category-mechanical.html">点击继续</a></p>
    <script>
      const target = new URL("category-mechanical.html", location.href);
      new URLSearchParams(location.search).forEach((value, key) => {
        if (!target.searchParams.has(key)) target.searchParams.set(key, value);
      });
      target.hash = location.hash;
      location.replace(target.href);
      document.getElementById("destination").href = target.href;
    </script>
  </body>
</html>
