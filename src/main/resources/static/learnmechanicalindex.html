<!doctype html>

  <head>

    <title>机械类学习路线 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 8%, #c7d2fe 0, transparent 30%), radial-gradient(circle at 94% 90%, #a5f3fc 0, transparent 27%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); }
      .page { width: min(900px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back, .route a { color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .hero { padding: 70px 0 45px; }
      .eyebrow { margin: 0 0 10px; color: #4f46e5; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 56px); letter-spacing: -.06em; }
      .hero p { max-width: 600px; margin: 18px 0 0; color: #64748b; line-height: 1.8; }
      .route { position: relative; padding: 30px; border: 1px solid #dce5f5; border-radius: 22px; background: #ffffffd9; box-shadow: 0 16px 40px #30458e14; }
      .route-icon { display: grid; width: 52px; height: 52px; place-items: center; border-radius: 16px; color: #4338ca; background: #e0e7ff; font-size: 24px; }
      .route h2 { margin: 22px 0 10px; font-size: 24px; }
      .route p { max-width: 620px; margin: 0; color: #64748b; line-height: 1.8; }
      .route a { display: inline-block; margin-top: 24px; }
      .tag { position: absolute; top: 23px; right: 23px; padding: 5px 9px; border: 1px solid #93c5fd; border-radius: 999px; color: #2563eb; background: #eff6ff; font-size: 11px; font-weight: 800; }
      .hint { margin-top: 18px; color: #94a3b8; font-size: 12px; }
      .foot { margin-top: 40px; color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · 机械类专业</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="hero"><p class="eyebrow">Mechanical route</p><h1>你懂鸡加工吗？</h1><p>机械类与自动化类专业未来会拆分成更细的方向。目前先共用机械类学习路线，后续我们会再逐步展开。</p></section>
      <article class="route"><span class="tag">公开</span><div class="route-icon">⚙</div><h2>通用就业路线</h2><p>覆盖机械结构、制造工艺、电气基础、控制原理与智能制造实践。</p><a href="learnmechanical.html">进入就业路线 →</a><p class="hint">自动化专业独立路线正在规划中。</p></article>
      <p class="foot">ProfilesSystem · 机械类专业学习空间</p>
    </main>
  </body>
</html>
