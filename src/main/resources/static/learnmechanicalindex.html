<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>机械类学习导向 · ProfilesSystem</title>
    <style>
      :root { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; color: #172554; background: #eef3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: radial-gradient(circle at 10% 8%, #c7d2fe 0, transparent 30%), radial-gradient(circle at 94% 90%, #a5f3fc 0, transparent 27%), linear-gradient(135deg, #eef3ff, #f8fafc 58%, #f1edff); animation: pageIn .45s ease-out both; }
      .page { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 28px 0 44px; animation: riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
      .mark { display: grid; width: 35px; height: 35px; place-items: center; border-radius: 11px; color: #111a3b; background: linear-gradient(135deg, #9ca9ff, #62e4d5); }
      .back { color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .hero { padding: 70px 0 48px; }
      .eyebrow { margin: 0 0 10px; color: #4f46e5; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(34px, 6vw, 58px); letter-spacing: -.06em; }
      .hero p { max-width: 650px; margin: 18px 0 0; color: #64748b; line-height: 1.8; }
      .section-title { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 16px; }
      .section-title h2 { margin: 0; font-size: 21px; }
      .section-title span { color: #64748b; font-size: 13px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
      .route { position: relative; min-height: 270px; padding: 28px; border: 1px solid #6366f1; border-radius: 21px; background: #ffffffdf; box-shadow: 0 0 0 4px #6366f11f, 0 18px 42px #30458e18; transition: .25s; }
      .route { cursor: pointer; }
      .route.wide { grid-column: 1 / -1; }
      .route:hover { transform: translateY(-5px); box-shadow: 0 0 0 4px #6366f129, 0 24px 50px #30458e24; }
      .route.card-enter { animation: cardIn .45s cubic-bezier(.2,.9,.3,1.15) both; animation-delay: var(--card-delay, 0ms); }
      @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .route-icon { display: grid; width: 49px; height: 49px; place-items: center; border-radius: 15px; color: #4338ca; background: #e0e7ff; font-size: 23px; }
      .route h3 { margin: 23px 0 10px; font-size: 23px; }
      .route p { max-width: 620px; margin: 0; color: #64748b; line-height: 1.8; font-size: 14px; }
      .route a { display: inline-block; margin-top: 25px; color: #4f46e5; font-size: 13px; font-weight: 800; text-decoration: none; }
      .tag { position: absolute; top: 22px; right: 22px; padding: 5px 9px; border: 1px solid #93c5fd; border-radius: 999px; color: #2563eb; background: #eff6ff; font-size: 11px; font-weight: 800; }
      .selectBox { position: relative; z-index: 10; width: 280px; margin: 0 0 22px; }
      .selectBox-trigger { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 16px; border: 1.5px solid #e6e8f0; border-radius: 14px; color: #1f2333; background: #fff; box-shadow: 0 1px 2px #14193c0a; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
      .selectBox-trigger:hover { border-color: #c7cdf5; }
      .selectBox.is-open .selectBox-trigger { border-color: #6c7bff; box-shadow: 0 0 0 4px #6c7bff29; }
      .selectBox-arrow { flex: none; color: #8e95ad; transition: transform .25s cubic-bezier(.2,.9,.3,1.3); }
      .selectBox.is-open .selectBox-arrow { transform: rotate(180deg); color: #6c7bff; }
      .selectBox-menu { position: absolute; top: calc(100% + 8px); right: 0; left: 0; margin: 0; padding: 6px; border: 1px solid #eceef6; border-radius: 16px; list-style: none; background: #fff; box-shadow: 0 18px 40px -12px #171c3f47, 0 4px 12px #171c3f0f; opacity: 0; visibility: hidden; transform: translateY(-8px) scale(.98); transform-origin: top; transition: opacity .18s, transform .18s cubic-bezier(.2,.9,.3,1.15), visibility .18s; }
      .selectBox.is-open .selectBox-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
      .selectBox-option { padding: 10px 12px; border-radius: 10px; color: #3b4157; font-size: 14.5px; cursor: pointer; user-select: none; }
      .selectBox-option:hover, .selectBox-option.is-active { color: #4b57d6; background: #f0f2ff; }
      .selectBox-option[aria-selected="true"] { color: #4b57d6; background: #f5f6ff; font-weight: 600; }
      .selectBox-option[aria-selected="true"]::after { content: "✓"; float: right; color: #6c7bff; }
      .foot { margin-top: 40px; color: #94a3b8; font-size: 12px; }
      @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @media (max-width: 680px) { .page { width: min(100% - 22px, 560px); padding-top: 18px; } .hero { padding: 56px 0 40px; } .section-title { align-items: flex-start; flex-direction: column; } .grid { grid-template-columns: 1fr; } .selectBox { width: 100%; } }
      @media (prefers-reduced-motion: reduce) { body, .page { animation: none; } .route { transition: none; } }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><div class="brand"><span class="mark">P</span><span>ProfilesSystem · 机械类专业</span></div><a class="back" href="learnIndex.html">← 返回专业选择</a></header>
      <section class="hero"><p class="eyebrow">Mechanical engineering routes</p><h1>让图纸里的结构真正动起来</h1><p>从力学、材料与工程制图出发，逐步走进机械设计、制造工艺和智能制造，在真实约束里寻找可靠的工程答案。</p></section>
      <section>
        <div class="section-title"><h2>学习导向</h2><span>选择路线方向与具体专业</span></div>
        <div class="selectBox" id="contentModeBox"><button class="selectBox-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="selectBox-value">路线方向</span><svg class="selectBox-arrow" width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5 10 12.5 15 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><ul class="selectBox-menu" role="listbox" aria-label="学习导向"><li class="selectBox-option" role="option" tabindex="-1" data-value="route" aria-selected="true">路线方向</li><li class="selectBox-option" role="option" tabindex="-1" data-value="major" aria-selected="false">具体专业</li></ul><input type="hidden" id="contentMode" value="route" /></div>
        <div class="grid" id="cardGrid"></div>
      </section>
      <p class="foot">ProfilesSystem · 机械类专业学习空间</p>
    </main>
    <script>
      const contentMode = document.getElementById("contentMode");
      const cardGrid = document.getElementById("cardGrid");
      const sectionHint = document.querySelector(".section-title span");
      const cardData = {
        route: [{ icon: "⚙", title: "通用就业路线", description: "覆盖机械基础、结构设计、制造工艺、工程软件与智能制造实践，建立面向岗位的通用能力框架。", href: "learnmechanical.html", action: "进入就业路线", wide: true }],
        major: [
          { icon: "M", title: "机械工程", description: "关注机械系统设计、分析、制造与工程应用。", major: "mechanical-engineering" },
          { icon: "⚙", title: "机械设计制造及其自动化", description: "连接机械设计、制造工艺与自动化生产技术。", major: "mechanical-design" },
          { icon: "◇", title: "材料成型及控制工程", description: "关注材料成型过程、工艺控制和质量分析。", major: "material-forming" },
          { icon: "⌁", title: "机械电子工程", description: "融合机械、电子、控制和嵌入式系统。", major: "mechatronic-engineering" },
          { icon: "✎", title: "工业设计", description: "关注产品功能、工程实现、形态与用户体验。", major: "industrial-design" },
          { icon: "◫", title: "过程装备与控制工程", description: "面向过程工业装备、系统运行与安全控制。", major: "process-equipment" },
          { icon: "▱", title: "车辆工程", description: "关注车辆结构、动力系统、测试与智能化。", major: "vehicle-engineering" },
          { icon: "◉", title: "汽车服务工程", description: "关注汽车技术服务、检测维护、运营与后市场。" },
          { icon: "⌘", title: "机械工艺技术", description: "关注机械加工工艺、生产组织与工程实践。" },
          { icon: "◫", title: "微机电系统工程", description: "研究微型机械、传感器、执行器与集成系统。" },
          { icon: "✦", title: "机电技术教育", description: "融合机电工程技术与职业教育教学能力。" },
          { icon: "▣", title: "汽车维修工程教育", description: "面向汽车维修技术、工程实践与职业教育。" },
          { icon: "✦", title: "智能制造工程", description: "连接数字化制造、工业数据和智能产线。", major: "intelligent-manufacturing" },
          { icon: "⌖", title: "智能车辆工程", description: "关注智能驾驶、车辆控制、感知与系统集成。" },
          { icon: "≈", title: "仿生科学与工程", description: "从生物结构与机理中寻找工程设计方法。" },
          { icon: "ϟ", title: "新能源汽车工程", description: "研究新能源车辆动力、控制、热管理与整车集成。" },
          { icon: "＋", title: "增材制造工程", description: "关注三维打印、材料成形、工艺与装备系统。" },
          { icon: "◎", title: "智能交互设计", description: "融合工程设计、智能技术与人机交互体验。" },
          { icon: "△", title: "应急装备技术与工程", description: "面向应急救援装备的设计、制造与可靠应用。" },
          { icon: "♧", title: "农林智能装备工程", description: "研究服务农林生产的智能机械与自动化装备。" },
          { icon: "○", title: "真空工程与技术", description: "关注真空获得、测量、装备及相关工程应用。" },
        ],
      };
      function renderCards() {
        const mode = contentMode.value;
        sectionHint.textContent = mode === "route" ? "选择一条路线开始学习" : "选择你的机械类具体专业";
        cardGrid.innerHTML = cardData[mode].map(item => { const href = item.href || `majorDemo.html?title=${encodeURIComponent(item.title)}&return=learnmechanicalindex.html`; return `<article class="route${item.wide ? " wide" : ""}"><span class="tag">公开</span><div class="route-icon">${item.icon}</div><h3>${item.title}</h3><p>${item.description}</p><a href="${href}">${item.action || "查看专业导向"} →</a></article>`; }).join("");
        cardGrid.querySelectorAll(".route").forEach((card, index) => { card.style.setProperty("--card-delay", `${index * 55}ms`); card.classList.add("card-enter"); });
      }
      const contentModeBox = document.getElementById("contentModeBox");
      const modeTrigger = contentModeBox.querySelector(".selectBox-trigger");
      const modeValue = contentModeBox.querySelector(".selectBox-value");
      const modeOptions = Array.from(contentModeBox.querySelectorAll(".selectBox-option"));
      function closeModeMenu() { contentModeBox.classList.remove("is-open"); modeTrigger.setAttribute("aria-expanded", "false"); }
      function chooseMode(option) { modeOptions.forEach(item => item.setAttribute("aria-selected", String(item === option))); contentMode.value = option.dataset.value; modeValue.textContent = option.textContent.trim(); closeModeMenu(); renderCards(); }
      modeTrigger.addEventListener("click", () => { const opening = !contentModeBox.classList.contains("is-open"); contentModeBox.classList.toggle("is-open", opening); modeTrigger.setAttribute("aria-expanded", String(opening)); if (opening) modeOptions.find(item => item.getAttribute("aria-selected") === "true")?.focus(); });
      modeOptions.forEach(option => { option.addEventListener("click", () => chooseMode(option)); option.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") chooseMode(option); if (event.key === "Escape") { closeModeMenu(); modeTrigger.focus(); } }); });
      document.addEventListener("click", event => { if (!contentModeBox.contains(event.target)) closeModeMenu(); });
      cardGrid.addEventListener("click", event => { if (event.target.closest("a")) return; const link = event.target.closest(".route")?.querySelector("a[href]"); if (link) link.click(); });
      renderCards();
    </script>
  </body>
</html>
